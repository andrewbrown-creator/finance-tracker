<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'self'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finances">
<title>Finance Manager</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f6f7f9; --ink: #18202e; --muted: #5b6475; --line: #e2e5eb;
    --accent: #2b59c3; --accent-ink: #ffffff;
    --halifax: #1f4fbf;  --halifax-soft: #eaf0fd;
    --monzo: #c8432b;    --monzo-soft: #fdeee9;
    --transfer: #7d3fa8; --transfer-soft: #f4ecfa;
    --good: #1b7a45;     --good-soft: #e4f4ea;
    --bad: #b8322a;      --bad-soft: #fbe8e6;
    --warn: #8a5a00;     --warn-soft: #fdf3df;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f131a; --surface: #171c25; --surface-2: #1e2430; --ink: #e8ebf1; --muted: #9ba4b3; --line: #2b3241;
      --accent: #86a8ff; --accent-ink: #0f131a;
      --halifax: #93b2ff; --halifax-soft: #1a2540;
      --monzo: #ff9a85;   --monzo-soft: #37201b;
      --transfer: #d3a4f2; --transfer-soft: #2b1f36;
      --good: #67d497;    --good-soft: #143020;
      --bad: #ff8f85;     --bad-soft: #3a1c1a;
      --warn: #f2c063;    --warn-soft: #352912;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f131a; --surface: #171c25; --surface-2: #1e2430; --ink: #e8ebf1; --muted: #9ba4b3; --line: #2b3241;
    --accent: #86a8ff; --accent-ink: #0f131a;
    --halifax: #93b2ff; --halifax-soft: #1a2540;
    --monzo: #ff9a85;   --monzo-soft: #37201b;
    --transfer: #d3a4f2; --transfer-soft: #2b1f36;
    --good: #67d497;    --good-soft: #143020;
    --bad: #ff8f85;     --bad-soft: #3a1c1a;
    --warn: #f2c063;    --warn-soft: #352912;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  code { font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
  a { color: var(--accent); font-weight: 600; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .topbar {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand pill" "tabs tabs";
    align-items: center; gap: 6px 10px; padding-top: 10px;
  }
  .brand { grid-area: brand; font-weight: 750; font-size: 17px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .logo {
    width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; font-size: 15px; font-weight: 800;
    color: #fff; background: linear-gradient(135deg, var(--halifax), var(--transfer));
  }
  .topbar .pill { grid-area: pill; justify-self: end; }
  .topbar .tabs { grid-area: tabs; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px; border: 0; cursor: pointer; background: var(--surface-2); color: var(--muted); white-space: nowrap;
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--good-soft); color: var(--good); }
  .pill.busy { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); padding: 8px 12px;
    border-radius: 999px; font: inherit; font-size: 14px; font-weight: 650; white-space: nowrap; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
  @media (max-width: 400px) { .tabs button { padding: 8px 9px; font-size: 13.5px; } }
  @media (max-width: 370px) { .brand-text { display: none; } }

  main { padding-top: 16px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

  /* Month navigation */
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .month-nav .title { text-align: center; line-height: 1.2; }
  .month-nav .title strong { display: block; font-size: 20px; }
  .month-nav .title small { color: var(--muted); font-size: 13.5px; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; flex-shrink: 0;
  }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card-head h2 { margin: 0; }
  .card p { margin: 0 0 10px; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; margin: 0; }
  .muted { color: var(--muted); }
  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .step-head h2 { margin: 0; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--surface);
    display: grid; place-items: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
  }
  .step-head .right { margin-left: auto; font-weight: 750; font-variant-numeric: tabular-nums; }

  details.card > summary {
    cursor: pointer; font-weight: 700; font-size: 16px; list-style: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "\25BE"; color: var(--muted); transition: transform .2s; }
  details.card[open] > summary { margin-bottom: 12px; }
  details.card[open] > summary::after { transform: rotate(180deg); }
  details.card > summary .muted { font-weight: 500; font-size: 14px; margin-left: auto; }
  details.inline > summary { cursor: pointer; color: var(--accent); font-weight: 650; font-size: 14px; margin-top: 6px; }
  details.inline[open] > summary { margin-bottom: 6px; }

  /* Forms */
  .field { margin-bottom: 14px; }
  .field > label, .lbl { display: block; font-size: 14px; font-weight: 650; margin-bottom: 6px; }
  .money-input { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 0 12px; }
  .money-input:focus-within { border-color: var(--accent); }
  .money-input span { color: var(--muted); font-weight: 650; }
  .money-input input {
    border: 0; background: transparent; outline: none; font: inherit; font-size: 17px; padding: 11px 8px;
    width: 100%; min-width: 0; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .money-input.big input { font-size: 24px; font-weight: 700; padding: 12px 8px; }
  input[type=text], input[type=password], input[type=number], input[type=date], select {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 440px) { .grid2 { grid-template-columns: 1fr; } }
  label.check { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  .inline-row { display: flex; gap: 8px; align-items: stretch; }
  .inline-row .money-input { flex: 1; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface-2); padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 650; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .stepper { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
  .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 18px; cursor: pointer; }

  /* Buttons */
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 11px 16px; font: inherit; font-weight: 650; cursor: pointer; }
  .btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: var(--bad-soft); color: var(--bad); }
  .btn-sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; font-weight: 650; padding: 6px 0 0; cursor: pointer; text-align: left; }
  .tag {
    display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; white-space: nowrap;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

  /* Lines and results */
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .line small, .row-amt small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .line strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .line.total { font-weight: 750; border-top: 2px solid var(--line); }
  .big-result { border-radius: 14px; padding: 14px 16px; margin-top: 12px; border-left: 5px solid; }
  .big-result .label { font-size: 12.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .big-result .amount { font-size: 32px; font-weight: 800; margin: 2px 0; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .big-result .note { font-size: 14px; color: var(--muted); }
  .r-halifax { background: var(--halifax-soft); border-color: var(--halifax); }
  .r-halifax .amount { color: var(--halifax); }
  .r-monzo { background: var(--monzo-soft); border-color: var(--monzo); }
  .r-monzo .amount { color: var(--monzo); }
  .r-good { background: var(--good-soft); border-color: var(--good); }
  .r-good .amount { color: var(--good); }
  .r-bad { background: var(--bad-soft); border-color: var(--bad); }
  .r-bad .amount { color: var(--bad); }
  .status { font-size: 14.5px; padding: 9px 12px; border-radius: 10px; margin-top: 10px; }
  .status.ok { background: var(--good-soft); color: var(--good); }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .status.note { background: var(--warn-soft); color: var(--warn); }
  .running {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 14px;
    padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line); font-weight: 650; font-size: 15px;
  }
  .running strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .running.neg strong { color: var(--bad); }
  .notice { border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 14.5px; background: var(--warn-soft); border: 1px solid rgba(138,90,0,.18); }
  .notice.info { background: var(--halifax-soft); border-color: rgba(31,79,191,.18); }
  .notice .actions { margin-top: 8px; }

  /* Checklist */
  .progress-text { font-size: 13.5px; color: var(--muted); font-weight: 600; }
  .check-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .check-item input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--good); flex-shrink: 0; }
  .check-item.indent { padding-left: 26px; }
  .check-text { flex: 1; min-width: 0; }
  .check-text small { display: block; color: var(--muted); font-size: 13px; }
  .check-amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .check-item.done .check-text strong, .check-item.done .check-amt { color: var(--muted); text-decoration: line-through; }

  /* Rows */
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 650; overflow-wrap: anywhere; }
  .row-meta { font-size: 13px; color: var(--muted); }
  .row-amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .row.paused { opacity: .55; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 0; }
  td.amt, th.amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.past td { color: var(--muted); }
  tr.total td { font-weight: 750; border-top: 2px solid var(--line); }
  tr.minor td { color: var(--muted); font-size: 13px; }
  tr.split td { border-top: 2px solid var(--line); }
  td.nowrap { white-space: nowrap; }
  .notes { margin: 12px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
  .notes li { margin-bottom: 6px; }
  ol.steps { padding-left: 20px; margin: 0 0 14px; }
  ol.steps > li { margin-bottom: 12px; }
  ol.steps ul { margin: 6px 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }

  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); margin: 8px 0 4px; }
  .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
  .big-num { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0; }

  /* Dialog */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: calc(100vh - 40px); }
  dialog::backdrop { background: rgba(10,14,22,.5); }
  dialog form { padding: 20px; }
  dialog h3 { margin: 0 0 14px; font-size: 18px; }
  .dialog-actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  .dialog-actions .spacer { flex: 1; }
  .form-error { color: var(--bad); font-size: 14px; font-weight: 600; margin: 4px 0 0; min-height: 1em; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .badge { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .group-label { font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 0; }
  .move { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .group-label + .move { border-top: 0; }
  .move-main { flex: 1; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; min-width: 0; }
  .move-main input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--good); flex-shrink: 0; }
  .move.done .check-text strong { color: var(--muted); text-decoration: line-through; }
  .copy {
    font: inherit; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer;
    background: var(--halifax-soft); color: var(--halifax); border: 0; border-radius: 10px; padding: 7px 10px;
  }
  .copy:active { transform: scale(.97); }
  .move.done .copy { background: var(--surface-2); color: var(--muted); }
  .wf { border-top: 1px solid var(--line); }
  .wf > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 11px 0; }
  .wf > summary::-webkit-details-marker { display: none; }
  .wf-label small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .wf > summary strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wf > summary strong::after { content: " \25BE"; color: var(--accent); font-size: 12px; }
  .wf[open] > summary strong::after { content: " \25B4"; }
  .wf-body { padding: 0 0 12px 12px; margin-left: 4px; border-left: 2px solid var(--line); }
  .wf-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; margin: 6px 0; border-radius: 10px; background: var(--surface-2); font-weight: 700; }
  .wf-total strong { font-variant-numeric: tabular-nums; }
  .wf-total.start { background: var(--halifax-soft); }
  .wf-total.neg strong { color: var(--bad); }
  .wf-line, .wf-weeks { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .wf-weeks small { display: block; color: var(--muted); font-size: 12.5px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .wf-body > .item:first-child { border-top: 0; }
  .item-main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item-main small { display: block; color: var(--muted); font-size: 12.5px; }
  .item strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item.skipped .item-main span, .item.skipped strong { text-decoration: line-through; color: var(--muted); }
  .mini { font: inherit; font-size: 13px; font-weight: 650; padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; white-space: nowrap; }
  .adj-editor { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 6px 0 10px; }
  .adj-editor .lbl { margin-bottom: 8px; }
  .adj-editor input[type=text], .adj-editor input[type=date], .adj-editor select { background: var(--surface); }
  .adj-editor .money-input { background: var(--surface); }
  .ops { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
  .dot.halifax { background: var(--halifax); }
  .dot.monzo { background: var(--monzo); }
  .dot.done { background: var(--good); }
  .glance { display: none; }
  .tile-label { font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .tile-amount { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin-top: 4px; }
  .tile-note { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* Wider screens: one header row, a summary strip and two columns */
  @media (min-width: 1024px) {
    body { background: radial-gradient(1100px 380px at 50% -120px, var(--halifax-soft), transparent 70%), var(--bg); background-attachment: fixed; }
    .wrap { max-width: 1200px; padding: 0 32px; }
    header.top { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .topbar { grid-template-columns: 1fr auto 1fr; grid-template-areas: "brand tabs pill"; padding-top: 12px; padding-bottom: 12px; }
    .topbar .tabs { padding-bottom: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
    .tabs button { flex: 0 0 auto; padding: 8px 18px; }
    main { padding-top: 26px; }
    .card { padding: 22px 24px; border-radius: 20px; }
    .month-nav { margin: 0 auto 18px; max-width: 560px; }

<script>
'use strict';

// ===== ENGINE START =====
// All the maths lives here. Money is always whole pence (integers) so totals never drift.
// Dates are 'YYYY-MM-DD' strings so they compare simply and ignore time zones.
// A "month" is named after its payday, e.g. '2026-10' is the 15 October payday. That pay keeps
// the rest of October's bills in Halifax and covers all of November.
const Engine = (() => {
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const nums = s => s.split('-').map(Number);
  const toDate = s => { const [y, m, d] = nums(s); return new Date(y, m - 1, d, 12); };
  const fromDate = dt => iso(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  const addDays = (s, n) => { const dt = toDate(s); dt.setDate(dt.getDate() + n); return fromDate(dt); };
  const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
  const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
  const shiftMonth = (id, n) => {
    const [y, m] = nums(id);
    const t = y * 12 + (m - 1) + n;
    return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
  };
  const clampDay = (monthId, day) => {
    const [y, m] = nums(monthId);
    return iso(y, m, Math.min(Math.max(1, day | 0), daysInMonth(y, m)));
  };
  const monthEnd = id => { const [y, m] = nums(id); return iso(y, m, daysInMonth(y, m)); };
  const sum = list => list.reduce((t, x) => t + (x.amount || 0), 0);
  const live = x => !!x && x.active !== false && x.amount > 0;

  // The usual payday for a month, moved off weekends if the setting says so.
  function nominalPayday(id, settings) {
    let s = clampDay(id, settings.payDay);
    const w = toDate(s).getDay();
    if (settings.weekendRule === 'before') {
      if (w === 6) s = addDays(s, -1);
      if (w === 0) s = addDays(s, -2);
    } else if (settings.weekendRule === 'after') {
      if (w === 6) s = addDays(s, 2);
      if (w === 0) s = addDays(s, 1);
    }
    return s;
  }

  function paydayOf(id, state) {
    const m = state.months && state.months[id];
    return (m && m.paydayOverride) || nominalPayday(id, state.settings);
  }

  // Which payday a date falls after.
  function monthIdFor(date, state) {
    let id = date.slice(0, 7);
    if (date < paydayOf(id, state)) id = shiftMonth(id, -1);
    const next = shiftMonth(id, 1);
    if (paydayOf(next, state) <= date) id = next;
    return id;
  }

  function period(id, state) {
    const payday = paydayOf(id, state);
    const nextId = shiftMonth(id, 1);
    const nextPayday = paydayOf(nextId, state);
    return {
      id, payday, nextPayday, end: addDays(nextPayday, -1),
      monthEnd: monthEnd(id), nextId, nextStart: nextId + '-01', nextEnd: monthEnd(nextId)
    };
  }

  // The days of a month that fall on a weekday (0 Sunday to 6 Saturday). Mondays by default.
  function weeksIn(monthId, weekday) {
    const [y, m] = nums(monthId);
    const out = [];
    for (let d = 1; d <= daysInMonth(y, m); d++) if (new Date(y, m - 1, d, 12).getDay() === weekday) out.push(d);
    return out;
  }

  // Every date a monthly payment on `day` falls between `from` and `to` (inclusive).
  function datesInRange(day, from, to) {
    const out = [];
    if (!from || !to || from > to) return out;
    for (let id = from.slice(0, 7); id <= to.slice(0, 7); id = shiftMonth(id, 1)) {
      const d = clampDay(id, day);
      if (d >= from && d <= to) out.push(d);
    }
    return out;
  }

  function billDates(b, from, to) {
    if (b.once) { const d = clampDay(b.once, b.day); return d >= from && d <= to ? [d] : []; }
    return datesInRange(b.day, from, to);
  }

  // A bill can be changed or skipped for one date only: state.adjust['billId:YYYY-MM-DD']
  function occurrence(state, b, d) {
    const a = state.adjust && state.adjust[`${b.id}:${d}`];
    if (a && a.skip) return { amount: 0, skipped: true };
    if (a && a.amount != null) return { amount: a.amount, changed: a.amount !== b.amount };
    return { amount: b.amount };
  }

  function billsBetween(state, from, to, withSkipped) {
    const out = [];
    for (const b of state.bills || []) {
      if (!live(b)) continue;
      for (const d of billDates(b, from, to)) {
        const o = occurrence(state, b, d);
        if (o.skipped && !withSkipped) continue;
        out.push({ key: `b:${b.id}:${d}`, id: b.id, name: b.name, amount: o.amount, usual: b.amount,
          changed: !!o.changed, skipped: !!o.skipped, date: d,
          debtId: b.debtId || null, reimbursed: !!b.reimbursed, once: !!b.once });
      }
    }
    return out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.name.localeCompare(b.name)));
  }

  // Money paid out of Halifax that is coming back (work expenses, someone paying you back),
  // still outstanding on a given date.
  function owedAt(state, date) {
    return (state.owed || []).filter(o => o.amount > 0 && o.spent <= date && (!o.back || o.back > date));
  }

  // Regular monthly amount going to a debt from Halifax bills.
  function monthlyFor(debtId, state) {
    return sum((state.bills || []).filter(b => live(b) && !b.once && b.debtId === debtId));
  }

  // Estimated balance: the last figure entered, less linked bills whose date has passed since,
  // less extra payments ticked off since. Ticks from `excludeMonth` can be left out.
  function debtBalance(debt, state, until, excludeMonth) {
    let bal = debt.balance || 0;
    if (debt.updated) {
      const from = addDays(debt.updated, 1);
      for (const b of state.bills || []) {
        if (!live(b) || b.debtId !== debt.id) continue;
        for (const d of billDates(b, from, until)) bal -= occurrence(state, b, d).amount;
      }
    }
    for (const [mid, m] of Object.entries(state.months || {})) {
      if (mid === excludeMonth) continue;
      for (const t of Object.values(m.ticks || {})) {
        if (t && t.debtId === debt.id && (t.ts || 0) > (debt.updatedTs || 0)) bal -= t.amount || 0;
      }
    }
    return Math.max(0, bal);
  }

  // How many monthly payments until a debt is cleared, and the interest on the way.
  function projectDebt(balance, apr, monthly) {
    if (!(balance > 0)) return { months: 0, interest: 0 };
    if (!(monthly > 0)) return { months: null, interest: 0, never: true };
    const r = (apr || 0) / 100 / 12;
    let b = balance, months = 0, interest = 0;
    while (b > 0) {
      const i = Math.round(b * r);
      if (i >= monthly || months >= 600) return { months: null, interest, never: true };
      b += i - monthly;
      interest += i;
      months++;
    }
    return { months, interest };
  }

  function buildPlan(state, id, today) {
    const s = state.settings;
    const m = (state.months && state.months[id]) || {};
    const per = period(id, state);

    // The Halifax balance is a snapshot on the day it was typed. Bills before that day have gone.
    const pay = m.pay || 0;
    const entered = m.halifax != null;
    const ref = entered && m.halifaxAt && m.halifaxAt > per.payday ? m.halifaxAt : per.payday;

    // What has to stay in Halifax: the rest of this month plus all of next month
    const rest = billsBetween(state, ref, per.monthEnd, true);
    const next = billsBetween(state, per.nextStart, per.nextEnd, true);
    const restTotal = sum(rest);
    const nextTotal = sum(next);
    const buffer = s.buffer || 0;
    const keep = restTotal + nextTotal + buffer;

    // What is there. Without a Halifax balance, assume last month kept back exactly enough.
    const halifax = entered ? m.halifax : pay + restTotal + buffer;

    // Money owed back to you: counted now only if Halifax can still pay every bill until it lands
    const owed = entered ? owedAt(state, ref) : [];
    const owedTotal = sum(owed);
    let owedCounted = 0, owedRisk = null, owedLow = null, owedUntil = null;
    if (owedTotal > 0) {
      owedUntil = owed.map(o => o.expected || per.nextPayday).sort().pop();
      let run = keep - owedTotal, low = run, at = null;
      for (const l of [...rest, ...next]) {
        if (l.skipped || l.date > owedUntil) continue;
        run -= l.amount;
        if (run < low) { low = run; at = l; }
      }
      if (low >= 0) { owedCounted = owedTotal; owedLow = low; }
      else owedRisk = { date: at.date, name: at.name, short: -low };
    }
    const free = halifax + owedCounted - keep;

    // Monzo for next month: weekly amounts times the weeks, with any changes for this month only
    const mondays = weeksIn(per.nextId, s.weekDay == null ? 1 : s.weekDay);
    const weeks = m.weeks != null ? m.weeks : mondays.length;
    const potOver = m.pots || {};
    const pots = { shop: [], spend: [] };
    for (const b of state.budgets || []) {
      if (!live(b) || !pots[b.pot]) continue;
      const usual = b.per === 'week' ? b.amount * weeks : b.amount;
      const total = potOver[b.id] != null ? potOver[b.id] : usual;
      pots[b.pot].push({ key: `p:${b.id}`, id: b.id, name: b.name, amount: b.amount, per: b.per, usual, total, changed: total !== usual });
    }
    for (const x of m.potExtras || []) {
      if (pots[x.pot] && x.amount > 0) pots[x.pot].push({ key: `px:${x.id}`, id: x.id, name: x.name, amount: x.amount, total: x.amount, extra: true });
    }
    const shop = pots.shop.reduce((t, x) => t + x.total, 0);
    const spend = pots.spend.reduce((t, x) => t + x.total, 0);
    const monzo = shop + spend;

    // Payday transfers, with this month's changes and one-off payments
    const tOver = m.transferAmounts || {};
    const transfers = [];
    for (const t of state.transfers || []) {
      if (!live(t)) continue;
      const amount = tOver[t.id] != null ? tOver[t.id] : t.amount;
      transfers.push({ key: `t:${t.id}`, id: t.id, name: t.name, amount, usual: t.amount, changed: amount !== t.amount, skipped: amount === 0 });
    }
    for (const x of m.transferExtras || []) {
      if (x.amount > 0) transfers.push({ key: `tx:${x.id}`, id: x.id, name: x.name, amount: x.amount, debtId: x.debtId || null, extra: true });
    }
    const transfersTotal = sum(transfers);

    // Money brought back from savings to cover a short month
    const fromSavings = Math.max(0, m.fromSavings || 0);
    const leftover = free + fromSavings - monzo - transfersTotal;

    const debts = (state.debts || []).map(d => ({
      id: d.id, name: d.name, apr: d.apr || 0,
      now: debtBalance(d, state, today),
      base: debtBalance(d, state, today, id),
      monthly: monthlyFor(d.id, state),
      nextMonth: sum(next.filter(l => l.debtId === d.id)) + sum(transfers.filter(t => t.debtId === d.id))
    }));
    let extra = 0, extraDebt = null;
    if (leftover > 0 && m.extra && m.extra.amount > 0) {
      const d = debts.find(x => x.id === m.extra.debtId);
      if (d) { extra = Math.min(m.extra.amount, leftover, d.base); extraDebt = extra > 0 ? d.id : null; }
    }
    const toSavings = Math.max(0, leftover - extra);

    // Where you stand
    const ticks = m.ticks || {};
    const savingsNow = (state.savings && state.savings.balance) || 0;
    const savingsAfter = savingsNow + (ticks['x:savings'] ? 0 : toSavings) - (ticks['x:fromsavings'] ? 0 : fromSavings);
    const debtTotal = debts.reduce((t, d) => t + d.now, 0);
    const pendingDebt = (ticks['x:debt'] ? 0 : extra) + sum(transfers.filter(t => t.debtId && !ticks[t.key]));
    const debtAfter = Math.max(0, debtTotal - pendingDebt);
    const owedPending = owedRisk && !ticks['o:later'] ? owedTotal : 0;
    const net = savingsAfter - debtAfter + owedPending;
    const debtNextMonth = debts.reduce((t, d) => t + d.nextMonth, 0) + extra;

    const reimb = (state.bills || []).filter(b => live(b) && b.reimbursed && !b.once);
    const reimbTotal = sum(reimb);

    // Halifax check for any day in this period: everything still to come up to the end of next month
    let todayCheck = null;
    if (today >= per.payday && today <= per.end) {
      const still = billsBetween(state, today, per.nextEnd);
      todayCheck = { required: sum(still) + buffer, count: still.length, dueToday: sum(still.filter(l => l.date === today)), owed: sum(owedAt(state, today)) };
    }

    // Bill by bill from the payday moves, including the day any counted money comes back
    const flow = [...rest, ...next].filter(l => !l.skipped);
    if (owedCounted) flow.push({ key: 'owed-in', name: 'Owed back to you', amount: -owedCounted, date: owedUntil, inflow: true });
    flow.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.inflow ? 1 : 0) - (b.inflow ? 1 : 0)));
    let run = keep - owedCounted;
    const timeline = flow.map(l => { run -= l.amount; return { ...l, after: run }; });

    const balanced = leftover < 0 || keep + monzo + transfersTotal + extra + toSavings === halifax + owedCounted + fromSavings;

    return {
      period: per, ref, pay, halifax, entered, rest, next, restTotal, nextTotal, buffer, keep, free,
      owed, owedTotal, owedCounted, owedRisk, owedLow, owedUntil, owedPending,
      weeks, mondays, autoWeeks: mondays.length, pots, shop, spend, monzo, transfers, transfersTotal,
      fromSavings, leftover, extra, extraDebt, toSavings, debts, debtTotal, debtAfter, savingsNow, savingsAfter, net,
      debtNextMonth, reimb, reimbTotal, todayCheck, timeline, balanced,
      isPast: today > per.end, isFuture: today < per.payday
    };
  }

  return {
    iso, toDate, fromDate, addDays, diffDays, shiftMonth, daysInMonth, clampDay, monthEnd,
    nominalPayday, paydayOf, monthIdFor, period, weeksIn, datesInRange, billsBetween, owedAt,
    monthlyFor, debtBalance, projectDebt, buildPlan
  };
})();
// ===== ENGINE END =====

// ===== APP =====
const KEY = 'financeManager.v3';
const SYNC_KEY = 'financeManager.sync';
const VERSION = '3.1';
const DATA_PATH = 'data.json';

const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

const $ = (sel, root = document) => root.querySelector(sel);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const GBP = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const money = p => GBP.format((p || 0) / 100);
const toP = v => {
  if (v == null || String(v).trim() === '') return null;
  const n = Number(String(v).replace(/[£,\s]/g, ''));
  return Number.isFinite(n) ? Math.round(n * 100) : null;
};
const toPounds = p => (p == null ? '' : (p / 100).toFixed(2));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const listJoin = arr => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

const TODAY_OVERRIDE = (() => {
  try { const t = new URLSearchParams(location.search).get('today'); return /^\d{4}-\d{2}-\d{2}$/.test(t || '') ? t : null; }
  catch (e) { return null; }
})();
const today = () => TODAY_OVERRIDE || Engine.fromDate(new Date());

function fmtDate(s, withYear) {
  if (!s) return '';
  const d = Engine.toDate(s);
  return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}${withYear ? ' ' + d.getFullYear() : ''}`;
}
function fmtShort(s) { const d = Engine.toDate(s); return `${d.getDate()} ${MON[d.getMonth()]}`; }
const monthName = id => MONTH[Number(id.slice(5, 7)) - 1];
const monthLabel = id => `${monthName(id)} ${id.slice(0, 4)}`;

// ---------- State ----------
function defaults() {
  return {
    version: 3,
    settings: { payDay: 15, weekendRule: 'before', weekDay: 1, buffer: 0, savingsLabel: 'Monzo savings pot' },
    bills: [], budgets: [], transfers: [], debts: [],
    savings: { balance: 0, updated: '' },
    months: {}, adjust: {}, owed: [],
    meta: { created: today(), updatedAt: 0, lastBackup: '' }
  };
}

function seed(s) {
  const b = (name, per, pot) => s.budgets.push({ id: uid(), name, amount: 0, per, pot, active: true });
  b('Food', 'week', 'shop');
  b('Petrol', 'week', 'shop');
  b('Haircuts', 'month', 'shop');
  b('Spending money', 'week', 'spend');
  s.transfers.push({ id: uid(), name: "Daughter's savings", amount: 0, active: true });
}

function normalise(s) {
  const d = defaults();
  s = s && typeof s === 'object' ? s : {};
  const arr = k => (Array.isArray(s[k]) ? s[k] : []);
  return {
    version: 3,
    settings: { ...d.settings, ...(s.settings || {}) },
    bills: arr('bills'), budgets: arr('budgets'), transfers: arr('transfers'), debts: arr('debts'),
    savings: { ...d.savings, ...(s.savings || {}) },
    months: s.months && typeof s.months === 'object' ? s.months : {},
    adjust: s.adjust && typeof s.adjust === 'object' ? s.adjust : {},
    owed: Array.isArray(s.owed) ? s.owed : [],
    meta: { ...d.meta, ...(s.meta || {}) }
  };
}

function readStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// Brings across anything entered in the previous version on this device.
function fromV2(v2) {
  if (v2 === undefined) { try { v2 = JSON.parse(readStore('financeManager.v2') || 'null'); } catch (e) { v2 = null; } }
  if (!v2 || !Array.isArray(v2.items)) return null;
  const s = defaults();
  s.debts = (v2.debts || []).map(d => ({ ...d }));
  s.savings = { ...s.savings, ...(v2.savings || {}) };
  if (v2.settings) s.settings.payDay = v2.settings.payDay || 15;
  for (const it of v2.items) {
    const base = { id: it.id || uid(), name: it.name, amount: it.amount || 0, active: it.active !== false };
    if (it.from === 'shopping' || it.from === 'spend') s.budgets.push({ ...base, per: 'month', pot: it.from === 'spend' ? 'spend' : 'shop' });
    else if (it.from === 'transfer' && it.kind !== 'debt') s.transfers.push(base);
    else s.bills.push({ ...base, day: it.day || s.settings.payDay, debtId: it.kind === 'debt' ? it.debtId || null : null, reimbursed: false });
  }
  if (!s.budgets.length) seed(s);
  return s;
}

function load() {
  const raw = readStore(KEY);
  if (raw) {
    try { return normalise(JSON.parse(raw)); }
    catch (e) { try { localStorage.setItem(KEY + '.unreadable', raw); } catch (e2) { /* ignore */ } }
  }
  const old = fromV2();
  if (old) return old;
  const s = defaults();
  seed(s);
  return s;
}

function hasRealData(s) {
  return s.bills.length > 0 || s.debts.length > 0 || s.budgets.some(b => b.amount > 0) || s.transfers.some(t => t.amount > 0) || (s.savings.balance || 0) > 0;
}

let state = load();
const view = { tab: 'payday', monthId: Engine.monthIdFor(today(), state), open: {}, editDebt: null, adj: null, add: null, whatIf: null };

function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('This browser would not save. Download a backup from Settings.'); }
}

// Every change goes through here: saved on this device straight away, then to the private store.
function save() {
  state.meta.updatedAt = Date.now();
  saveLocal();
  if (connected()) { sync.dirty = true; saveSync(); schedulePush(); }
}

function month(id = view.monthId) {
  if (!state.months[id]) state.months[id] = { ticks: {} };
  if (!state.months[id].ticks) state.months[id].ticks = {};
  return state.months[id];
}
const debtName = id => (state.debts.find(d => d.id === id) || {}).name || 'debt';

function toast(msg) {

// ---------- Sync with the private GitHub store ----------
let sync = (() => { try { return JSON.parse(readStore(SYNC_KEY) || 'null') || {}; } catch (e) { return {}; } })();
const syncView = { status: 'off', detail: '' };
const connected = () => !!(sync.token && sync.owner && sync.repo);
function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) { /* ignore */ } }
const guessOwner = () => (location.hostname.endsWith('.github.io') ? location.hostname.slice(0, -'.github.io'.length) : '');

function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const b64url = s => b64encode(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64url = s => b64decode(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));

function deviceName() {
  const ua = navigator.userAgent || '';
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  if (/Macintosh/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'Windows';
  return 'browser';
}

class SyncError extends Error { constructor(kind, status) { super(kind); this.kind = kind; this.status = status; } }
const kindFor = status => (status === 401 ? 'auth' : status === 403 ? 'forbidden' : status === 404 ? 'notfound' : 'error');

async function api(method, path, body) {
  let res;
  try {
    res = await fetch('https://api.github.com' + path, {
      method, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw new SyncError('offline'); }
  return res;
}
const filePath = () => `/repos/${encodeURIComponent(sync.owner)}/${encodeURIComponent(sync.repo)}/contents/${DATA_PATH}`;

async function pullRemote() {
  const res = await api('GET', filePath());
  if (res.status === 404) return { exists: false };
  if (!res.ok) throw new SyncError(kindFor(res.status), res.status);
  const j = await res.json();
  let data;
  try { data = JSON.parse(b64decode(j.content || '')); } catch (e) { throw new SyncError('damaged'); }
  return { exists: true, sha: j.sha, data };
}

async function pushRemote() {
  const body = { message: `Update from ${deviceName()}`, content: b64encode(JSON.stringify(state, null, 1)) };
  if (sync.sha) body.sha = sync.sha;
  const res = await api('PUT', filePath(), body);
  if (res.status === 409 || res.status === 422) return { conflict: true };
  if (!res.ok) throw new SyncError(kindFor(res.status), res.status);
  const j = await res.json();
  return { sha: j.content && j.content.sha };
}

function adopt(remote) {
  state = normalise(remote.data);
  sync.sha = remote.sha;
  sync.dirty = false;
  saveSync();
  saveLocal();
  renderAll();
}

async function pushWithRetry() {
  let r = await pushRemote();
  if (r.conflict) {
    const remote = await pullRemote();
    if (remote.exists && remote.sha !== sync.sha) {
      if (confirm('Your figures were also changed on another device.\n\nOK: use the latest saved figures.\nCancel: keep what is on this screen and save over them.')) { adopt(remote); return; }
      sync.sha = remote.sha;
    } else if (!remote.exists) sync.sha = null;
    r = await pushRemote();
    if (r.conflict) throw new SyncError('conflict');
  }
  sync.sha = r.sha;
  sync.dirty = false;
}

let pushTimer = null, syncBusy = false, syncAgain = false;
function schedulePush() {
  clearTimeout(pushTimer);
  setSyncStatus('busy');
  pushTimer = setTimeout(syncNow, 1200);
}

async function syncNow() {
  if (!connected()) { setSyncStatus('off'); return; }
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true;
  clearTimeout(pushTimer);
  setSyncStatus('busy');
  try {
    if (!sync.dirty) {
      const remote = await pullRemote();
      if (!remote.exists) { sync.sha = null; sync.dirty = true; }
      else if (remote.sha !== sync.sha) adopt(remote);
    }
    if (sync.dirty) await pushWithRetry();
    sync.syncedAt = Date.now();
    saveSync();
    setSyncStatus('ok');
  } catch (e) {
    setSyncStatus(e.kind || 'error');
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; syncNow(); }
  }
}

async function connect(owner, repo, token) {
  sync = { owner, repo, token, sha: null, dirty: false };
  const res = await api('GET', `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);
  if (!res.ok) { const k = kindFor(res.status); sync = {}; throw new SyncError(k, res.status); }
  const remote = await pullRemote();
  if (remote.exists) {
    if (!hasRealData(normalise(remote.data))) {
      // The store only holds empty starter figures, so this device's figures win without asking
      sync.sha = remote.sha;
      sync.dirty = true;
    } else if (hasRealData(state) && !confirm('Your private store already has figures in it.\n\nOK: use the saved figures (recommended).\nCancel: replace them with the figures on this device.')) {
      sync.sha = remote.sha;
      sync.dirty = true;
    } else {
      adopt(remote);
    }
  } else {
    sync.dirty = true;
  }
  saveSync();
  await syncNow();
}

const SYNC_TEXT = {
  off: ['This device only', ''], busy: ['Saving', 'busy'], ok: ['Saved', 'ok'], offline: ['Offline', 'busy'],
  auth: ['Key not working', 'bad'], forbidden: ['No access', 'bad'], notfound: ['Store not found', 'bad'],
  conflict: ['Not saved', 'bad'], damaged: ['Store unreadable', 'bad'], error: ['Not saved', 'bad']
};
const SYNC_HELP = {
  offline: "You're offline. Changes are kept on this device and will save when you're back online.",
  auth: 'GitHub did not accept your key. It may have expired. Create a new one and paste it below.',
  forbidden: 'Your key cannot open the store. Check it has Contents set to Read and write for finance-data.',
  notfound: "The store can't be found. Check it's called finance-data and your key includes it.",
  conflict: 'Saving clashed with another device. Tap Sync now to try again.',
  damaged: 'The saved figures could not be read. Restore from a backup, or contact support.',
  error: 'Something went wrong saving. Tap Sync now to try again.'
};
function setSyncStatus(st) {
  syncView.status = connected() ? st : 'off';
  const [text, cls] = SYNC_TEXT[syncView.status] || SYNC_TEXT.error;

  pill.textContent = text;

}

function connectLink() {

// Links can carry a connection (#connect=) or a prepared set of figures (#import=).
const incoming = (() => {
  const out = {};
  const h = location.hash.slice(1);
  if (!h) return out;
  try {
    const p = new URLSearchParams(h);
    if (p.get('connect')) out.connect = JSON.parse(fromB64url(p.get('connect')));
    if (p.get('import')) out.import = JSON.parse(fromB64url(p.get('import')));
  } catch (e) { out.broken = true; }
  history.replaceState(null, '', location.pathname + location.search);
  return out;
})();

function glanceHtml(p) {
  const tile = (cls, label, amount, note) => `<div class="tile ${cls}"><div class="tile-label">${label}</div><div class="tile-amount">${amount}</div><div class="tile-note">${note}</div></div>`;
  const next = monthName(p.period.nextId);
  return [
    tile('halifax', 'Leave in Halifax', money(p.keep - p.owedCounted), `Every bill until ${fmtShort(p.period.nextEnd)}`),
    tile('monzo', 'Send to Monzo', money(p.monzo + p.toSavings), `Pots for ${next}, plus savings`),
    p.leftover < 0 ? tile('bad', 'Short this month', money(-p.leftover), 'See the fixes in your moves') : tile('good', 'Into savings', money(p.toSavings), p.extra ? `Plus ${money(p.extra)} off a debt` : `Your ${esc(state.settings.savingsLabel)}`),
    tile(p.net >= 0 ? 'good' : 'bad', p.net >= 0 ? 'In the black' : 'In the red', money(Math.abs(p.net)), 'Savings against everything you owe')
  ].join('');
}

function beforePayHtml(p) {
  const mn = monthName(p.period.id);
  const need = p.restTotal + p.buffer;
  if (!p.entered) {
    const owedNote = (state.owed || []).some(o => !o.back) ? ' You have money owed back to you, so typing the balance matters this month.' : '';
    return p.pay ? `<div class="status note">No Halifax balance yet, so this assumes you kept back ${money(need)} for the rest of ${mn}. Type the balance to check.${owedNote}</div>` : '';
  }
  if (!p.pay) return '';
  const before = p.halifax - p.pay + p.owedTotal;
  const plus = p.owedTotal ? ` (counting the ${money(p.owedTotal)} owed back to you)` : '';
  if (before >= need) return `<div class="status ok">&#10003; Before your pay, Halifax had ${money(before)}${plus}. That covers the rest of ${mn} (${money(need)}), so you're a month ahead.</div>`;
  return `<div class="status note">Before your pay, Halifax had ${money(before)}${plus}: ${money(need - before)} less than the rest of ${mn} needs. Part of this pay covers it.</div>`;
}

// Expenses usually come back with a payday, but not one only days away

  if (Engine.diffDays(spent, d) < 14) d = Engine.period(Engine.monthIdFor(d, state), state).nextPayday;
  return d;
}

function movesHtml(p) {

  const hal = [], mon = [], then = [];

  if (send > 0) {
    const parts = [p.shop && `Shop ${money(p.shop)}`, p.spend && `Spend ${money(p.spend)}`, p.toSavings && `Savings ${money(p.toSavings)}`].filter(Boolean);
    hal.push({ key: 'm:send', title: 'Send to Monzo', sub: parts.join(' + '), amount: send });
  }
  for (const t of p.transfers) {
    if (t.amount > 0) hal.push({ key: t.key, title: t.name, sub: t.debtId ? `Pays off ${debtName(t.debtId)}` : t.extra ? `One-off for ${next}` : '', amount: t.amount, debtId: t.debtId });
  }
  if (p.extra) hal.push({ key: 'x:debt', title: `Extra off ${debtName(p.extraDebt)}`, amount: p.extra, debtId: p.extraDebt });
  if (p.fromSavings) mon.push({ key: 'x:fromsavings', title: 'Take this out of your savings pot and send it to Halifax', sub: 'Ticking this takes it off your savings figure.', amount: p.fromSavings });
  if (p.shop) mon.push({ key: 'p:shop', title: 'Shop pot', amount: p.shop });
  if (p.spend) mon.push({ key: 'p:spend', title: 'Spend pot', amount: p.spend });

  then.push({ key: 'h:check', title: 'Halifax should now show', amount: p.keep - p.owedCounted, noCopy: true,

    ${short}
    ${hal.length ? `<div class="group-label"><span class="dot halifax"></span>In the Halifax app</div>${hal.map(row).join('')}` : ''}
    ${mon.length ? `<div class="group-label"><span class="dot monzo"></span>In the Monzo app</div>${mon.map(row).join('')}` : ''}
    <div class="group-label"><span class="dot done"></span>Then</div>${then.map(row).join('')}
    <p class="hint">Tap an amount to copy it, then paste it into your banking app.</p>
  </div>`;
}

// One line of the running list, with a Change or Remove button and an optional editor under it
const itemRow = x => `<div class="item ${x.skipped ? 'skipped' : ''}">
    <div class="item-main"><span>${esc(x.name)}</span>${x.sub ? `<small>${x.sub}</small>` : ''}</div>
    <strong>${money(x.amount)}</strong>
    <button class="mini" data-action="${x.act}" data-key="${esc(x.key || '')}" data-id="${esc(x.id || '')}">${x.label}</button>
  </div>${x.editor || ''}`;

function changeEditor(key, title, value, usual, changed, skipLabel, foot) {
  return `<div class="adj-editor">
    <div class="lbl">${title}</div>
    <div class="inline-row"><div class="money-input"><span>&pound;</span><input id="adjAmt" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${toPounds(value)}"></div>
      <button class="btn btn-sm" data-action="adj-save" data-key="${esc(key)}">Save</button></div>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" data-action="adj-skip" data-key="${esc(key)}">${skipLabel}</button>
      ${changed ? `<button class="btn btn-ghost btn-sm" data-action="adj-reset" data-key="${esc(key)}">Back to ${money(usual)}</button>` : ''}
      <button class="link" data-action="adj-close">Cancel</button>
    </div>
    <p class="hint">${foot}</p>
  </div>`;
}

function addForm(formId, kind, label, o = {}) {
  if (view.add !== formId) return `<button class="link" data-action="add-open" data-form="${formId}">+ ${label}</button>`;
  return `<div class="adj-editor">
    <div class="lbl">${label}</div>
    <input type="text" id="addName" maxlength="40" autocomplete="off" placeholder="${o.placeholder || 'What is it?'}">
    <div class="inline-row" style="margin-top:8px">
      <div class="money-input"><span>&pound;</span><input id="addAmt" inputmode="decimal" autocomplete="off" placeholder="0.00"></div>
      ${kind === 'bill' ? `<input type="date" id="addDate" min="${o.min}" max="${o.max}" value="${o.min}" aria-label="Date it comes out" style="max-width:170px">` : ''}
    </div>
    ${kind === 'owed' ? `<div class="grid2" style="margin-top:8px">
      <div><label class="lbl" for="addDate">Spent on</label><input type="date" id="addDate" max="${today()}" value="${today()}"></div>
      <div><label class="lbl" for="addExpected">Back by about</label><input type="date" id="addExpected" min="${today()}" value="${defaultBackBy(today())}"></div>
    </div><p class="hint">Paid out of Halifax, coming back to Halifax: work expenses, or someone paying you back.</p>` : ''}
    ${kind === 'transfer' && state.debts.length ? `<select id="addDebt" style="margin-top:8px"><option value="">Not paying off a debt</option>${state.debts.map(d => `<option value="${esc(d.id)}">Pays off ${esc(d.name)}</option>`).join('')}</select>` : ''}
    <div class="actions"><button class="btn btn-sm" data-action="add-save" data-kind="${kind}" data-pot="${o.pot || ''}" data-section="${o.section || ''}">Add</button><button class="link" data-action="add-close">Cancel</button></div>
  </div>`;
}

function billItems(lines, section, min, max) {
  const rows = lines.map(l => itemRow({
    key: l.key, id: l.id, name: l.name, amount: l.amount, skipped: l.skipped,
    sub: [fmtDate(l.date), l.skipped ? 'skipped this time' : l.changed ? `usually ${money(l.usual)}` : '', l.once ? 'one-off' : '', l.reimbursed ? 'work pays back' : ''].filter(Boolean).join(' &middot; '),
    act: l.once ? 'remove-bill' : 'adj-open', label: l.once ? 'Remove' : 'Change',
    editor: view.adj === l.key ? changeEditor(l.key, `${esc(l.name)} on ${fmtDate(l.date)} only`, l.skipped ? l.usual : l.amount, l.usual, l.changed || l.skipped, 'Skip it this time', `Other months stay at ${money(l.usual)}. To change it for good, edit it in Bills.`) : ''
  })).join('');
  return (rows || '<p class="empty">No bills here.</p>') + addForm(`add-${section}`, 'bill', 'Add a one-off bill', { min, max, section, placeholder: 'e.g. MOT' });
}

function potItems(p, list, pot) {
  const next = monthName(p.period.nextId);
  const rows = list.map(x => itemRow({
    key: x.key, id: x.id, name: x.name, amount: x.total, skipped: !x.extra && x.total === 0 && x.usual > 0,
    sub: x.extra ? `one-off for ${next}` : (x.per === 'week' ? `${money(x.amount)} a week &times; ${p.weeks}` : 'each month') + (x.changed ? ` &middot; usually ${money(x.usual)}` : ''),
    act: x.extra ? 'remove-potextra' : 'adj-open', label: x.extra ? 'Remove' : 'Change',
    editor: view.adj === x.key ? changeEditor(x.key, `${esc(x.name)} for ${next} only`, x.total, x.usual, x.changed, `Nothing for ${next}`, 'Other months stay as usual. To change it for good, edit it in Bills.') : ''
  })).join('');
  return (rows || '<p class="empty">Nothing set.</p>') + addForm(`add-${pot}`, 'pot', pot === 'shop' ? 'Add extra to the Shop pot' : 'Add extra to the Spend pot', { pot, section: pot, placeholder: pot === 'shop' ? 'e.g. Christmas food' : 'e.g. Birthday night out' });
}

function transferItems(p) {
  const next = monthName(p.period.nextId);
  const rows = p.transfers.map(t => itemRow({
    key: t.key, id: t.id, name: t.name, amount: t.amount, skipped: t.skipped,
    sub: t.extra ? (t.debtId ? `one-off &middot; pays off ${esc(debtName(t.debtId))}` : 'one-off') : t.skipped ? 'skipped this time' : t.changed ? `usually ${money(t.usual)}` : '',
    act: t.extra ? 'remove-transfer' : 'adj-open', label: t.extra ? 'Remove' : 'Change',
    editor: view.adj === t.key ? changeEditor(t.key, `${esc(t.name)} for ${next} only`, t.skipped ? t.usual : t.amount, t.usual, t.changed, 'Skip it this time', 'Other months stay as usual.') : ''
  })).join('');
  return (rows || '<p class="empty">None set.</p>') + addForm('add-transfer', 'transfer', 'Add a one-off payment', { section: 'transfers', placeholder: 'e.g. Leyla' });
}

function addsUpHtml(p, ready) {
  const per = p.period;
  const s = state.settings;
  const mn = monthName(per.id), nx = monthName(per.nextId);
  const sec = (id, title, sub, amount, body, sign = '&minus;') => `<details class="wf" id="${id}" ${view.open[id] ? 'open' : ''}>
      <summary><span class="wf-label">${sign} ${title}${sub ? `<small>${sub}</small>` : ''}</span><strong>${money(amount)}</strong></summary>
      <div class="wf-body">${body}</div></details>`;
  const total = (label, amount, cls) => `<div class="wf-total ${cls || ''} ${amount < 0 ? 'neg' : ''}"><span>${label}</span><strong>${amount < 0 ? '&minus;' : ''}${money(Math.abs(amount))}</strong></div>`;
  const out = [];
  if (ready) out.push(total(p.entered ? `Halifax balance${p.ref > per.payday ? ` on ${fmtShort(p.ref)}` : ' now'}` : `Pay plus ${money(p.restTotal + p.buffer)} kept back`, p.halifax, 'start'));
  if (p.owed.length) {
    const note = p.owedCounted
      ? `<p class="status ok">&#10003; Counted. Halifax can pay every bill until it's back (lowest point ${money(p.owedLow)}), so your plan treats it as already here.</p>`
      : `<p class="status note">Not counted yet: Halifax would be ${money(p.owedRisk.short)} short on ${fmtDate(p.owedRisk.date)} (${esc(p.owedRisk.name)}) before it lands. When it's back, move it to savings: it's in your moves.</p>`;
    out.push(sec('wf-owed', 'Owed back to you', p.owedCounted ? `${plural(p.owed.length, 'item')}, counted` : `${plural(p.owed.length, 'item')}, not counted yet`, p.owedTotal, owedItems(p.owed) + note, '+'));
  }
  out.push(sec('wf-rest', `Rest of ${mn}`, `${plural(p.rest.filter(l => !l.skipped).length, 'bill')}, ${fmtShort(p.ref)} to ${fmtShort(per.monthEnd)}`, p.restTotal, billItems(p.rest, 'rest', p.ref, per.monthEnd)));
  out.push(sec('wf-next', `All of ${nx}`, plural(p.next.filter(l => !l.skipped).length, 'bill'), p.nextTotal, billItems(p.next, 'next', per.nextStart, per.nextEnd)));
  if (p.buffer) out.push(`<div class="wf-line"><span>&minus; Cushion</span><strong>${money(p.buffer)}</strong></div>`);
  if (!ready) {
    out.push(total('Leave in Halifax', p.keep, 'start'));
    return `<div class="card"><div class="card-head"><h2>How it adds up</h2></div>${out.join('')}</div>`;
  }
  out.push(total('Free to share out', p.free));
  const day = DOW_LONG[s.weekDay == null ? 1 : s.weekDay];
  out.push(`<div class="wf-weeks"><span>${nx} has <strong>${plural(p.weeks, 'week')}</strong><small>${p.weeks === p.autoWeeks ? `${day}s: ${p.mondays.join(', ')}` : `Changed from ${p.autoWeeks}`}</small></span>
    <span class="stepper"><button type="button" data-action="weeks" data-d="-1" aria-label="One week fewer">&minus;</button><button type="button" data-action="weeks" data-d="1" aria-label="One week more">+</button></span></div>`);
  out.push(sec('wf-shop', 'Shop pot', `for ${nx}`, p.shop, potItems(p, p.pots.shop, 'shop')));
  out.push(sec('wf-spend', 'Spend pot', `for ${nx}`, p.spend, potItems(p, p.pots.spend, 'spend')));
  const tTitle = p.transfers.length === 1 && !p.transfers[0].extra ? esc(p.transfers[0].name) : 'Payday transfers';
  out.push(sec('wf-transfers', tTitle, '', p.transfersTotal, transferItems(p)));
  if (p.fromSavings) out.push(`<div class="wf-line"><span>+ From your savings pot</span><span><strong>${money(p.fromSavings)}</strong> <button class="mini" data-action="undo-fromsavings">Undo</button></span></div>`);
  if (p.leftover >= 0) {
    const open = p.debts.filter(d => d.base > 0);
    const m = state.months[per.id] || {};
    const pricey = open.filter(d => d.apr > 0).sort((a, b) => b.apr - a.apr)[0];
    const showExtra = view.open.extra || p.extra > 0;
    out.push(`<div class="big-result r-good"><div class="label">Into your ${esc(s.savingsLabel)}</div><div class="amount">${money(p.toSavings)}</div>
      ${p.extra ? `<div class="note">Plus ${money(p.extra)} off ${esc(debtName(p.extraDebt))}.</div>` : ''}</div>`);
    if (pricey) out.push(`<p class="hint">${esc(pricey.name)} charges ${pricey.apr}% interest. Paying that off saves more than savings earn.</p>`);
    if (open.length && p.leftover > 0) {
      out.push(showExtra ? `<div class="grid2" style="margin-top:12px">
        <div class="field"><label for="extraDebt">Pay some off</label>
          <select id="extraDebt" data-extra="debtId">${open.map(d => `<option value="${esc(d.id)}" ${d.id === (m.extra && m.extra.debtId) ? 'selected' : ''}>${esc(d.name)} (${money(d.base)})</option>`).join('')}</select></div>
        <div class="field"><label for="extraAmt">Amount</label>
          <div class="money-input"><span>&pound;</span><input id="extraAmt" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-extra="amount" value="${p.extra ? toPounds(p.extra) : ''}" placeholder="0.00"></div></div>
      </div>` : '<button class="link" data-action="show-extra">Put some towards a debt instead</button>');
    }
  } else {
    out.push(`<div class="big-result r-bad"><div class="label">Short for ${nx}</div><div class="amount">${money(-p.leftover)}</div><div class="note">The fixes are in Your payday moves.</div></div>`);
  }
  const notes = [`This pay keeps the rest of ${mn} covered and pays for all of ${nx}, so you stay a month ahead.`];
  const raw = Engine.clampDay(per.id, s.payDay);
  if (per.payday !== raw) notes.push(`Payday is ${fmtDate(per.payday)} because ${(state.months[per.id] || {}).paydayOverride ? 'you changed it' : `the ${ordinal(Engine.toDate(raw).getDate())} is a ${DOW_LONG[Engine.toDate(raw).getDay()]}`}.`);
  const paused = state.bills.filter(b => b.active === false).map(b => b.name);
  if (paused.length) notes.push(`Paused, so not counted: ${esc(listJoin(paused))}.`);
  notes.push('Changes made here only affect that one month. Every sum uses whole pence.');
  return `<div class="card">
    <div class="card-head"><h2>How it adds up</h2>${p.balanced ? '<span class="badge">&#10003; Adds up</span>' : '<span class="badge bad">Check the figures</span>'}</div>
    <p class="hint" style="margin-top:0">Tap a line to see what's in it, or to change something just for this month.</p>
    ${out.join('')}
    <ul class="notes">${notes.map(n => `<li>${n}</li>`).join('')}</ul>
  </div>`;
}

function whatIfHtml(p, v) {
  if (!(v > 0)) return '';
  const sav = p.savingsAfter - v;
  const after = p.net - v;
  if (sav < 0) return `<div class="status bad">Your savings pot will have ${money(p.savingsAfter)}, so that's ${money(-sav)} more than you have.</div>`;
  if (after >= 0) return `<div class="status ok"><strong>Yes.</strong> Your savings would drop to ${money(sav)} and you'd still be ${money(after)} in the black.</div>`;
  return `<div class="status note">You can pay it from savings (leaving ${money(sav)}), but you'd be ${money(-after)} in the red overall.</div>`;
}

function standHtml(p) {
  const black = p.net >= 0;
  const ticks = (state.months[p.period.id] || {}).ticks || {};
  const rows = p.debts.filter(d => d.now > 0).map(d => lineHtml(d.name, d.now, d.nextMonth ? `${money(d.nextMonth)} going off in ${monthName(p.period.nextId)}` : '')).join('');
  return `<div class="card">
    <h2>Where you stand</h2>
    ${lineHtml(state.settings.savingsLabel, p.savingsAfter, p.toSavings && !ticks['x:savings'] ? `Includes this month's ${money(p.toSavings)}` : '')}
    ${p.owedPending ? lineHtml('Owed back to you', p.owedPending, 'Goes to savings when it lands') : ''}
    ${rows || '<p class="empty">No debts recorded.</p>'}
    ${lineHtml('Total debts', p.debtAfter, '', 'total')}
    <div class="big-result ${black ? 'r-good' : 'r-bad'}">
      <div class="label">${black ? 'In the black' : 'In the red'}</div>
      <div class="amount">${money(Math.abs(p.net))}</div>
      <div class="note">${black ? 'Your savings are more than everything you owe. This is money to play with.' : 'You owe more than you have saved. Every month you save brings this closer to zero.'}</div>
    </div>
    <div class="field" style="margin:14px 0 0">
      <label for="whatIf">Can I afford it?</label>
      <div class="money-input"><span>&pound;</span><input id="whatIf" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="e.g. a holiday" data-whatif value="${view.whatIf ? toPounds(view.whatIf) : ''}"></div>
    </div>
    <div id="whatIfResult">${whatIfHtml(p, view.whatIf)}</div>
    <button class="link" data-action="goto" data-tab="debts">Update savings or debts</button>
  </div>`;
}

function hcResultHtml(tc, actual) {
  if (actual == null) return '';
  const diff = actual - tc.required;
  if (diff < 0 && tc.owed && actual + tc.owed >= tc.required) return `<div class="status note"><strong>${money(-diff)} under,</strong> but ${money(tc.owed)} is owed back to you, so you're covered once it lands.</div>`;
  if (diff > 0) return `<div class="status ok"><strong>${money(diff)} more than needed.</strong> That's spare if you've already done your payday moves.</div>`;
  if (diff === 0) return '<div class="status ok"><strong>Spot on.</strong></div>';
  if (tc.dueToday && -diff <= tc.dueToday) return `<div class="status note"><strong>${money(-diff)} under.</strong> Fine if today's ${money(tc.dueToday)} has already gone out.</div>`;
  return `<div class="status bad"><strong>${money(-diff)} short.</strong> Top up Halifax before the next bill.</div>`;
}

function todayCheckHtml(p) {
  const tc = p.todayCheck;
  if (!tc || today() === p.period.payday) return ''; // on payday itself the moves cover this
  const m = state.months[p.period.id] || {};
  const fresh = m.check && m.check.at === today();
  return `<div class="card">
    <h2>Halifax check for today</h2>
    <p>Halifax should have at least <strong>${money(tc.required)}</strong> in it today.</p>
    <p class="hint">${plural(tc.count, 'bill')} still to come up to ${fmtShort(p.period.nextEnd)}${p.buffer ? ', plus your cushion' : ''}.</p>
    <div class="field" style="margin-top:12px">
      <label for="hcActual">What does the Halifax app show?</label>
      <div class="money-input"><span>&pound;</span><input id="hcActual" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-hc value="${fresh ? toPounds(m.check.amount) : ''}" placeholder="0.00"></div>
    </div>
    <div id="hcResult">${hcResultHtml(tc, fresh ? m.check.amount : null)}</div>
    ${tc.owed ? `<p class="hint">${money(tc.owed)} is owed back to you.</p>` : ''}
    <div style="margin-top:6px">${owedLink('check')}</div>
  </div>`;
}

function timelineHtml(p) {
  const t = today();
  return `<details class="card" id="timeline" ${view.open.timeline ? 'open' : ''}>
    <summary>Halifax, bill by bill <span class="muted">${plural(p.timeline.length, 'bill')}</span></summary>
    <p class="hint" style="margin-top:0">What should be left in Halifax after each bill. Greyed rows have gone.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Bill</th><th class="amt">Amount</th><th class="amt">After</th></tr></thead>
      <tbody>
        <tr class="minor"><td class="nowrap">${fmtDate(p.ref)}</td><td>After payday moves</td><td></td><td class="amt">${money(p.keep - p.owedCounted)}</td></tr>
        ${p.timeline.map(l => `<tr class="${l.date < t ? 'past' : ''}"><td class="nowrap">${fmtDate(l.date)}</td><td>${esc(l.name)}</td><td class="amt">${l.inflow ? '+' + money(-l.amount) : money(l.amount)}</td><td class="amt">${money(l.after)}</td></tr>`).join('')}
        <tr class="total"><td colspan="3">Left on ${fmtShort(p.period.nextEnd)}</td><td class="amt">${money(p.buffer)}</td></tr>
      </tbody>
    </table></div>
  </details>`;
}

function snapshot(p) {
  const m = month(p.period.id);
  const snap = { pay: p.pay, halifax: p.halifax, keep: p.keep, free: p.free, monzo: p.monzo, transfers: p.transfersTotal, leftover: p.leftover, toSavings: p.toSavings, extra: p.extra, net: p.net };
  if (JSON.stringify(m.snapshot) !== JSON.stringify(snap)) { m.snapshot = snap; save(); }
}

// ---------- Bills & budgets tab ----------
function renderMoney() {
  const el = $('#tab-money');
  const live = x => x.active !== false;
  const bills = state.bills.filter(b => !b.once).sort((a, b) => a.day - b.day || a.name.localeCompare(b.name));
  const thisMonth = today().slice(0, 7);
  const oneOffs = state.bills.filter(b => b.once && b.once >= thisMonth).sort((a, b) => a.once.localeCompare(b.once) || a.day - b.day);
  const billTotal = state.bills.filter(b => live(b) && !b.once).reduce((t, b) => t + (b.amount || 0), 0);
  const budgetRow = b => entryRow('budget', b, `${b.per === 'week' ? 'A week' : 'A month'}${b.active === false ? ' &middot; Paused' : ''}`);
  el.innerHTML = `<div class="split"><div>
    <div class="card">
      <div class="card-head"><h2>Halifax bills</h2><button class="btn btn-sm" data-action="add" data-kind="bill">Add bill</button></div>
      <p class="hint" style="margin-top:0">Everything that comes out of Halifax, with the day it goes.</p>
      ${bills.map(b => entryRow('bill', b, billMeta(b))).join('') || '<p class="empty">No bills yet. Add each direct debit and standing order.</p>'}
      ${lineHtml('Each month', billTotal, '', 'total')}
    </div>
    ${oneOffs.length ? `<div class="card">
      <h2>Coming up: one-off bills</h2>
      <p class="hint" style="margin-top:0">Added for a single month. Add more from the Payday screen.</p>
      ${oneOffs.map(b => entryRow('bill', b, billMeta(b))).join('')}
    </div>` : ''}
    </div><div>
    <div class="card">
      <div class="card-head"><h2>Monzo pots</h2><button class="btn btn-sm" data-action="add" data-kind="budget">Add</button></div>
      <p class="hint" style="margin-top:0">Weekly amounts are multiplied by the weeks in the month.</p>
      <div class="lbl" style="margin-top:10px">Shop pot</div>
      ${state.budgets.some(b => b.pot === 'shop') ? state.budgets.filter(b => b.pot === 'shop').map(budgetRow).join('') : '<p class="empty">Nothing yet.</p>'}
      <div class="lbl" style="margin-top:12px">Spend pot</div>
      ${state.budgets.some(b => b.pot === 'spend') ? state.budgets.filter(b => b.pot === 'spend').map(budgetRow).join('') : '<p class="empty">Nothing yet.</p>'}
    </div>
    <div class="card">
      <div class="card-head"><h2>Payday transfers</h2><button class="btn btn-sm" data-action="add" data-kind="transfer">Add</button></div>
      <p class="hint" style="margin-top:0">Moved each payday, like your daughter's savings.</p>
      ${state.transfers.map(t => entryRow('transfer', t, t.active === false ? 'Paused' : '')).join('') || '<p class="empty">None yet.</p>'}
    </div></div></div>`;
}

function billMeta(b) {
  const bits = [b.once ? `${ordinal(b.day)} ${monthName(b.once)} only` : `The ${ordinal(b.day)}`];
  if (b.debtId) bits.push('Pays off ' + esc(debtName(b.debtId)));
  if (b.reimbursed) bits.push('Work pays back');
  if (b.active === false) bits.push('Paused');
  return bits.join(' &middot; ');
}

function entryRow(kind, x, meta) {
  return `<div class="row ${x.active === false ? 'paused' : ''}">
    <div class="row-main"><div class="row-name">${esc(x.name)}</div>${meta ? `<div class="row-meta">${meta}</div>` : ''}</div>
    <div class="row-amt">${money(x.amount)}</div>
    <button class="btn btn-ghost btn-sm" data-action="edit" data-kind="${kind}" data-id="${esc(x.id)}">Edit</button>
  </div>`;
}

// ---------- Debts & savings tab ----------
function renderDebts() {
  const el = $('#tab-debts');
  const t = today();
  const debts = state.debts.map(d => ({ ...d, now: Engine.debtBalance(d, state, t), monthly: Engine.monthlyFor(d.id, state) }));
  const totalDebt = debts.reduce((x, d) => x + d.now, 0);
  const sav = state.savings.balance || 0;
  const net = sav - totalDebt;
  el.innerHTML = `<div class="cols">
    <div class="card">
      <h2>Where you stand today</h2>
      ${lineHtml(state.settings.savingsLabel, sav)}
      ${lineHtml('Debts', totalDebt)}
      <div class="big-result ${net >= 0 ? 'r-good' : 'r-bad'}">
        <div class="label">${net >= 0 ? 'In the black' : 'In the red'}</div>
        <div class="amount">${money(Math.abs(net))}</div>
