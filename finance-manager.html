<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'self'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finances">
<title>Finance Manager</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f6f7f9; --ink: #18202e; --muted: #5b6475; --line: #e2e5eb;
    --accent: #2b59c3; --accent-ink: #ffffff;
    --halifax: #1f4fbf;  --halifax-soft: #eaf0fd;
    --monzo: #c8432b;    --monzo-soft: #fdeee9;
    --transfer: #7d3fa8; --transfer-soft: #f4ecfa;
    --good: #1b7a45;     --good-soft: #e4f4ea;
    --bad: #b8322a;      --bad-soft: #fbe8e6;
    --warn: #8a5a00;     --warn-soft: #fdf3df;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f131a; --surface: #171c25; --surface-2: #1e2430; --ink: #e8ebf1; --muted: #9ba4b3; --line: #2b3241;
      --accent: #86a8ff; --accent-ink: #0f131a;
      --halifax: #93b2ff; --halifax-soft: #1a2540;
      --monzo: #ff9a85;   --monzo-soft: #37201b;
      --transfer: #d3a4f2; --transfer-soft: #2b1f36;
      --good: #67d497;    --good-soft: #143020;
      --bad: #ff8f85;     --bad-soft: #3a1c1a;
      --warn: #f2c063;    --warn-soft: #352912;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f131a; --surface: #171c25; --surface-2: #1e2430; --ink: #e8ebf1; --muted: #9ba4b3; --line: #2b3241;
    --accent: #86a8ff; --accent-ink: #0f131a;
    --halifax: #93b2ff; --halifax-soft: #1a2540;
    --monzo: #ff9a85;   --monzo-soft: #37201b;
    --transfer: #d3a4f2; --transfer-soft: #2b1f36;
    --good: #67d497;    --good-soft: #143020;
    --bad: #ff8f85;     --bad-soft: #3a1c1a;
    --warn: #f2c063;    --warn-soft: #352912;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  code { font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
  a { color: var(--accent); font-weight: 600; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; padding-bottom: 6px; }
  .brand { font-weight: 750; font-size: 17px; white-space: nowrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px; border: 0; cursor: pointer; background: var(--surface-2); color: var(--muted); white-space: nowrap;
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--good-soft); color: var(--good); }
  .pill.busy { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); padding: 8px 12px;
    border-radius: 999px; font: inherit; font-size: 14px; font-weight: 650; white-space: nowrap; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
  @media (max-width: 400px) { .tabs button { padding: 8px 9px; font-size: 13.5px; } }

  main { padding-top: 16px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

  /* Month navigation */
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .month-nav .title { text-align: center; line-height: 1.2; }
  .month-nav .title strong { display: block; font-size: 20px; }
  .month-nav .title small { color: var(--muted); font-size: 13.5px; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; flex-shrink: 0;
  }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card-head h2 { margin: 0; }
  .card p { margin: 0 0 10px; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; margin: 0; }
  .muted { color: var(--muted); }
  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .step-head h2 { margin: 0; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--surface);
    display: grid; place-items: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
  }
  .step-head .right { margin-left: auto; font-weight: 750; font-variant-numeric: tabular-nums; }

  details.card > summary {
    cursor: pointer; font-weight: 700; font-size: 16px; list-style: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "\25BE"; color: var(--muted); transition: transform .2s; }
  details.card[open] > summary { margin-bottom: 12px; }
  details.card[open] > summary::after { transform: rotate(180deg); }
  details.card > summary .muted { font-weight: 500; font-size: 14px; margin-left: auto; }
  details.inline > summary { cursor: pointer; color: var(--accent); font-weight: 650; font-size: 14px; margin-top: 6px; }
  details.inline[open] > summary { margin-bottom: 6px; }

  /* Forms */
  .field { margin-bottom: 14px; }
  .field > label, .lbl { display: block; font-size: 14px; font-weight: 650; margin-bottom: 6px; }
  .money-input { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 0 12px; }
  .money-input:focus-within { border-color: var(--accent); }
  .money-input span { color: var(--muted); font-weight: 650; }
  .money-input input {
    border: 0; background: transparent; outline: none; font: inherit; font-size: 17px; padding: 11px 8px;
    width: 100%; min-width: 0; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .money-input.big input { font-size: 24px; font-weight: 700; padding: 12px 8px; }
  input[type=text], input[type=password], input[type=number], input[type=date], select {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 440px) { .grid2 { grid-template-columns: 1fr; } }
  label.check { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  .inline-row { display: flex; gap: 8px; align-items: stretch; }
  .inline-row .money-input { flex: 1; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface-2); padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 650; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .stepper { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
  .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 18px; cursor: pointer; }

  /* Buttons */
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 11px 16px; font: inherit; font-weight: 650; cursor: pointer; }
  .btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: var(--bad-soft); color: var(--bad); }
  .btn-sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; font-weight: 650; padding: 6px 0 0; cursor: pointer; text-align: left; }
  .tag {
    display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; white-space: nowrap;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

  /* Lines and results */
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .line small, .row-amt small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .line strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .line.total { font-weight: 750; border-top: 2px solid var(--line); }
  .big-result { border-radius: 14px; padding: 14px 16px; margin-top: 12px; border-left: 5px solid; }
  .big-result .label { font-size: 12.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .big-result .amount { font-size: 32px; font-weight: 800; margin: 2px 0; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .big-result .note { font-size: 14px; color: var(--muted); }
  .r-halifax { background: var(--halifax-soft); border-color: var(--halifax); }
  .r-halifax .amount { color: var(--halifax); }
  .r-monzo { background: var(--monzo-soft); border-color: var(--monzo); }
  .r-monzo .amount { color: var(--monzo); }
  .r-good { background: var(--good-soft); border-color: var(--good); }
  .r-good .amount { color: var(--good); }
  .r-bad { background: var(--bad-soft); border-color: var(--bad); }
  .r-bad .amount { color: var(--bad); }
  .status { font-size: 14.5px; padding: 9px 12px; border-radius: 10px; margin-top: 10px; }
  .status.ok { background: var(--good-soft); color: var(--good); }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .status.note { background: var(--warn-soft); color: var(--warn); }
  .running {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 14px;
    padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line); font-weight: 650; font-size: 15px;
  }
  .running strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .running.neg strong { color: var(--bad); }
  .notice { border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 14.5px; background: var(--warn-soft); border: 1px solid rgba(138,90,0,.18); }
  .notice.info { background: var(--halifax-soft); border-color: rgba(31,79,191,.18); }
  .notice .actions { margin-top: 8px; }

  /* Checklist */
  .progress-text { font-size: 13.5px; color: var(--muted); font-weight: 600; }
  .check-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .check-item input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--good); flex-shrink: 0; }
  .check-item.indent { padding-left: 26px; }
  .check-text { flex: 1; min-width: 0; }
  .check-text small { display: block; color: var(--muted); font-size: 13px; }
  .check-amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .check-item.done .check-text strong, .check-item.done .check-amt { color: var(--muted); text-decoration: line-through; }

  /* Rows */
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 650; overflow-wrap: anywhere; }
  .row-meta { font-size: 13px; color: var(--muted); }
  .row-amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .row.paused { opacity: .55; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 0; }
  td.amt, th.amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.past td { color: var(--muted); }
  tr.total td { font-weight: 750; border-top: 2px solid var(--line); }
  tr.minor td { color: var(--muted); font-size: 13px; }
  tr.split td { border-top: 2px solid var(--line); }
  td.nowrap { white-space: nowrap; }
  .notes { margin: 12px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
  .notes li { margin-bottom: 6px; }
  ol.steps { padding-left: 20px; margin: 0 0 14px; }
  ol.steps > li { margin-bottom: 12px; }
  ol.steps ul { margin: 6px 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }

  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); margin: 8px 0 4px; }
  .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
  .big-num { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0; }

  /* Dialog */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: calc(100vh - 40px); }
  dialog::backdrop { background: rgba(10,14,22,.5); }
  dialog form { padding: 20px; }
  dialog h3 { margin: 0 0 14px; font-size: 18px; }
  .dialog-actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  .dialog-actions .spacer { flex: 1; }
  .form-error { color: var(--bad); font-size: 14px; font-weight: 600; margin: 4px 0 0; min-height: 1em; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  footer.foot { color: var(--muted); font-size: 12.5px; text-align: center; padding: 8px 0 0; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand">Finance Manager</div>
    <button class="pill" id="syncPill" data-action="goto" data-tab="settings" title="Where your figures are saved"></button>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="payday">Payday</button>
    <button role="tab" data-tab="money">Bills</button>
    <button role="tab" data-tab="debts">Debts</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
</header>

<main class="wrap">
  <section id="tab-payday" role="tabpanel"></section>
  <section id="tab-money" role="tabpanel" hidden></section>
  <section id="tab-debts" role="tabpanel" hidden></section>
  <section id="tab-settings" role="tabpanel" hidden></section>
</main>

<dialog id="editDialog" aria-labelledby="editTitle">
  <form id="editForm" novalidate>
    <h3 id="editTitle">Add</h3>
    <div class="field">
      <label for="fName">Name</label>
      <input type="text" id="fName" name="name" maxlength="60" autocomplete="off">
    </div>
    <div class="field">
      <label for="fAmount">Amount</label>
      <div class="money-input"><span>&pound;</span><input id="fAmount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0.00"></div>
    </div>
    <div data-for="budget">
      <div class="grid2">
        <div class="field">
          <label for="fPer">How often</label>
          <select id="fPer" name="per"><option value="week">Each week</option><option value="month">Each month</option></select>
        </div>
        <div class="field">
          <label for="fPot">Monzo pot</label>
          <select id="fPot" name="pot"><option value="shop">Shop</option><option value="spend">Spend</option></select>
        </div>
      </div>
    </div>
    <div data-for="bill">
      <div class="grid2">
        <div class="field">
          <label for="fDay">Day it comes out</label>
          <input type="number" id="fDay" name="day" min="1" max="31" inputmode="numeric" placeholder="1 to 31">
        </div>
        <div class="field">
          <label for="fOften">How often</label>
          <select id="fOften" name="often"></select>
        </div>
      </div>
      <p class="hint" style="margin:-8px 0 12px">The 29th to 31st fall on the last day of shorter months.</p>
      <div class="field">
        <label for="fDebt">Is it paying off a debt?</label>
        <select id="fDebt" name="debtId"></select>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" name="reimbursed"> Work pays this back to me</label>
      </div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" name="active"> Include in my plan</label>
      <p class="hint">Untick to pause something without deleting it.</p>
    </div>
    <p class="form-error" id="editError" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-danger btn-sm" data-action="delete-entry" id="editDelete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

// ===== ENGINE START =====
// All the maths lives here. Money is always whole pence (integers) so totals never drift.
// Dates are 'YYYY-MM-DD' strings so they compare simply and ignore time zones.
// A "month" is named after its payday, e.g. '2026-10' is the 15 October payday. That pay keeps
// the rest of October's bills in Halifax and covers all of November.
const Engine = (() => {
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const nums = s => s.split('-').map(Number);
  const toDate = s => { const [y, m, d] = nums(s); return new Date(y, m - 1, d, 12); };
  const fromDate = dt => iso(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  const addDays = (s, n) => { const dt = toDate(s); dt.setDate(dt.getDate() + n); return fromDate(dt); };
  const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
  const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
  const shiftMonth = (id, n) => {
    const [y, m] = nums(id);
    const t = y * 12 + (m - 1) + n;
    return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
  };
  const clampDay = (monthId, day) => {
    const [y, m] = nums(monthId);
    return iso(y, m, Math.min(Math.max(1, day | 0), daysInMonth(y, m)));
  };
  const monthEnd = id => { const [y, m] = nums(id); return iso(y, m, daysInMonth(y, m)); };
  const sum = list => list.reduce((t, x) => t + (x.amount || 0), 0);
  const live = x => !!x && x.active !== false && x.amount > 0;

  // The usual payday for a month, moved off weekends if the setting says so.
  function nominalPayday(id, settings) {
    let s = clampDay(id, settings.payDay);
    const w = toDate(s).getDay();
    if (settings.weekendRule === 'before') {
      if (w === 6) s = addDays(s, -1);
      if (w === 0) s = addDays(s, -2);
    } else if (settings.weekendRule === 'after') {
      if (w === 6) s = addDays(s, 2);
      if (w === 0) s = addDays(s, 1);
    }
    return s;
  }

  function paydayOf(id, state) {
    const m = state.months && state.months[id];
    return (m && m.paydayOverride) || nominalPayday(id, state.settings);
  }

const runningHtml = (label, amount) =>
  `<div class="running ${amount < 0 ? 'neg' : ''}"><span>${label}</span><strong>${amount < 0 ? '&minus;' : ''}${money(Math.abs(amount))}</strong></div>`;
const stepHead = (n, title, right) =>
  `<div class="step-head"><span class="step-num">${n}</span><h2>${title}</h2>${right ? `<span class="right">${right}</span>` : ''}</div>`;

function billListHtml(lines, id) {
  if (!lines.length) return '<p class="empty">No bills in this window.</p>';
  const t = today();
  return `<details class="inline" id="${id}" ${view.open[id] ? 'open' : ''}><summary>See the ${plural(lines.length, 'bill')}</summary>
    ${lines.map(l => `<div class="line ${l.date < t ? 'muted' : ''}"><span>${esc(l.name)}<small>${fmtDate(l.date)}${l.debtId ? ' &middot; pays off ' + esc(debtName(l.debtId)) : ''}${l.reimbursed ? ' &middot; work pays back' : ''}</small></span><strong>${money(l.amount)}</strong></div>`).join('')}
  </details>`;
}

function noticesHtml(p) {
  const out = [];
  const t = today();
  const cur = Engine.monthIdFor(t, state);
  if (!connected()) {
    out.push(`<div class="notice info"><strong>Your figures are only on this device.</strong> Connect your private store so your phone and laptops show the same thing.
      <div class="actions"><button class="btn btn-sm" data-action="goto" data-tab="settings">Set it up</button></div></div>`);
  }
  if (!state.bills.length) {
    out.push(`<div class="notice info"><strong>Add your Halifax bills first.</strong> Each one with the day it comes out. The planner works out the rest.
      <div class="actions"><button class="btn btn-sm" data-action="goto" data-tab="money">Add bills</button></div></div>`);
  }
  if (p.period.id === cur) {
    const days = Engine.diffDays(t, p.period.nextPayday);
    if (days <= 5) out.push(`<div class="notice"><strong>Payday is ${days === 1 ? 'tomorrow' : 'in ' + days + ' days'}</strong> (${fmtDate(p.period.nextPayday)}).
      <div class="actions"><button class="btn btn-sm" data-action="next-month">Plan ${monthName(p.period.nextId)}'s payday</button></div></div>`);
  }
  if (p.isPast) out.push(`<div class="notice">This payday has passed. Figures use your current bills, so may differ from what you planned then. <button class="link" data-action="this-month">Back to now</button></div>`);
  return out.join('');
}

function renderPayday() {
  const el = $('#tab-payday');
  const id = view.monthId;
  const p = Engine.buildPlan(state, id, today());
  const m = state.months[id] || {};
  const prev = state.months[Engine.shiftMonth(id, -1)];
  const per = p.period;
  const reimbNames = p.reimb.map(b => b.name);
  el.innerHTML = `
    <div class="month-nav">
      <button class="nav-btn" data-action="prev-month" aria-label="Previous payday">&#8249;</button>
      <div class="title"><strong>${monthName(id)} payday</strong><small>${fmtDate(per.payday, true)}${m.paydayOverride ? ' (changed)' : ''}</small></div>
      <button class="nav-btn" data-action="next-month" aria-label="Next payday">&#8250;</button>
    </div>
    ${noticesHtml(p)}
    <div class="card">
      ${stepHead(1, 'What came in')}
      <div class="field">
        <label for="inPay">Pay received</label>
        <div class="money-input big"><span>&pound;</span><input id="inPay" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-month-field="pay" value="${toPounds(m.pay)}" placeholder="0.00"></div>
        ${!m.pay && prev && prev.pay ? `<button class="link" id="samePay" data-action="same-pay">Use last month's ${money(prev.pay)}</button>` : ''}
      </div>
      ${p.reimbTotal ? `<div class="field">
        <div class="lbl">Work pays back ${money(p.reimbTotal)}</div>
        <p class="hint" style="margin:0 0 8px">${esc(listJoin(reimbNames))}. Has it reached Halifax?</p>
        <div class="seg" role="group" aria-label="Has the money from work arrived?">
          <button type="button" data-action="reimb" data-v="1" aria-pressed="${m.reimbLanded === true}">Yes, it's in</button>
          <button type="button" data-action="reimb" data-v="0" aria-pressed="${m.reimbLanded === false}">Not yet</button>
        </div>
      </div>` : ''}
      <div class="field">
        <label for="inHalifax">Halifax balance now</label>
        <div class="money-input"><span>&pound;</span><input id="inHalifax" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-month-field="halifax" value="${toPounds(m.halifax)}" placeholder="From your Halifax app"></div>
        <p class="hint">Once your pay has landed, open the Halifax app and type the balance. It makes the plan exact.</p>
      </div>
      <details class="inline" id="paydayEdit" ${view.open.paydayEdit ? 'open' : ''}><summary>Paid on a different day?</summary>
        <div class="inline-row">
          <input type="date" id="paydayOverride" value="${per.payday}" aria-label="Payday date">
          ${m.paydayOverride ? '<button class="btn btn-ghost btn-sm" data-action="reset-payday">Usual date</button>' : ''}
        </div>
      </details>
    </div>
    <div id="planOut"></div>`;
  renderPlan();
}

function renderPlan() {
  const p = Engine.buildPlan(state, view.monthId, today());
  const out = $('#planOut');
  if (!out) return;
  const hasPay = p.pay > 0 || p.entered;
  out.innerHTML = [
    stepRestHtml(p), stepNextHtml(p),
    hasPay ? stepMonzoHtml(p) : '', hasPay ? stepTransfersHtml(p) : '', hasPay ? stepLeftHtml(p) : '',
    hasPay ? standHtml(p) : '', hasPay ? checklistHtml(p) : waitingHtml(p),
    todayCheckHtml(p), timelineHtml(p), workingHtml(p, hasPay)
  ].join('');
  if (hasPay && !p.isPast) snapshot(p);
}

function waitingHtml(p) {
  return `<div class="card"><p style="margin:0"><strong>Enter your pay or Halifax balance above</strong> to see what goes to Monzo, your daughter's savings and your savings pot.</p>
    <p class="hint">Next month needs ${money(p.nextTotal)} in bills before anything else.</p></div>`;
}

function stepRestHtml(p) {
  const per = p.period;
  let status;
  if (p.entered) {
    status = p.halifax >= p.restTotal + p.buffer
      ? `<div class="status ok">&#10003; Covered. Halifax has enough for the rest of ${monthName(per.id)}.</div>`
      : `<div class="status bad">Halifax is ${money(p.restTotal + p.buffer - p.halifax)} short for the rest of ${monthName(per.id)}. Top it up today.</div>`;
  } else {
    status = `<div class="status note">Assumed covered by what you kept back last month. Enter your Halifax balance to check.</div>`;
  }
  return `<div class="card">
    ${stepHead(2, `Rest of ${monthName(per.id)}`, money(p.restTotal))}
    <p class="muted" style="margin:0">Bills from ${fmtShort(per.payday)} to ${fmtShort(per.monthEnd)}. Keep this in Halifax.</p>
    ${billListHtml(p.rest, 'restList')}
    ${status}
  </div>`;
}

function stepNextHtml(p) {
  const per = p.period;
  const next = monthName(per.nextId);
  const covered = p.halifax >= p.keep;
  const status = !p.entered && !p.pay ? ''
    : covered ? `<div class="status ok">&#10003; ${next} is fully covered.</div>`
    : `<div class="status bad">${money(p.keep - p.halifax)} short of covering all of ${next}.</div>`;
  return `<div class="card">
    ${stepHead(3, `All of ${next}`, money(p.nextTotal))}
    <p class="muted" style="margin:0">Every bill from 1 to ${Engine.toDate(per.nextEnd).getDate()} ${MON[Engine.toDate(per.nextEnd).getMonth()]}.</p>
    ${billListHtml(p.next, 'nextList')}
    <div class="big-result r-halifax">
      <div class="label">Leave in Halifax</div>
      <div class="amount">${money(p.keep)}</div>
      <div class="note">Rest of ${monthName(per.id)} ${money(p.restTotal)} + ${next} ${money(p.nextTotal)}${p.buffer ? ` + ${money(p.buffer)} buffer` : ''}. Covers everything until ${fmtShort(per.nextEnd)}.</div>
    </div>
    ${status}
    ${p.entered || p.pay ? runningHtml('Free to share out', p.free) : ''}
    ${!p.entered && p.pay ? '<p class="hint">Worked out from your pay. Enter your Halifax balance above for the exact figure.</p>' : ''}
  </div>`;
}

function stepMonzoHtml(p) {
  const next = monthName(p.period.nextId);
  const s = state.settings;
  const day = DOW_LONG[s.weekDay == null ? 1 : s.weekDay];
  const potLines = list => list.map(x => lineHtml(x.name, x.total, x.per === 'week' ? `${money(x.amount)} a week × ${p.weeks}` : 'Each month')).join('');
  return `<div class="card">
    ${stepHead(4, `Monzo for ${next}`, money(p.monzo))}
    <div class="line" style="border-top:0;align-items:center">
      <span>${next} has <strong>${plural(p.weeks, 'week')}</strong><small>${p.weeks === p.autoWeeks ? `${day}s: ${p.mondays.join(', ')}` : `Changed from ${p.autoWeeks}`}</small></span>
      <span class="stepper"><button type="button" data-action="weeks" data-d="-1" aria-label="One week fewer">&minus;</button><button type="button" data-action="weeks" data-d="1" aria-label="One week more">+</button></span>
    </div>
    <div class="lbl" style="margin-top:10px">Shop pot</div>
    ${p.pots.shop.length ? potLines(p.pots.shop) : '<p class="empty">Nothing set. Add food, petrol and so on in Bills.</p>'}
    ${lineHtml('Shop pot total', p.shop, '', 'total')}
    <div class="lbl" style="margin-top:12px">Spend pot</div>
    ${p.pots.spend.length ? potLines(p.pots.spend) : '<p class="empty">Nothing set yet.</p>'}
    ${lineHtml('Spend pot total', p.spend, '', 'total')}
    ${runningHtml('Left after Monzo', p.free - p.monzo)}
  </div>`;
}

function stepTransfersHtml(p) {
  return `<div class="card">
    ${stepHead(5, p.transfers.length === 1 ? esc(p.transfers[0].name) : 'Payday transfers', money(p.transfersTotal))}
    ${p.transfers.length ? p.transfers.map(t => lineHtml(t.name, t.amount)).join('') : '<p class="empty">None set.</p>'}
    ${runningHtml('Left over', p.leftover)}
  </div>`;
}

function stepLeftHtml(p) {
  const s = state.settings;
  const next = monthName(p.period.nextId);
  if (p.leftover < 0) {
    const short = -p.leftover;
    const tips = [];
    if (p.spend >= short) tips.push(`Trim the Spend pot to ${money(p.spend - short)} for ${next}.`);
    else if (p.spend > 0) tips.push(`Even with no Spend pot you'd be ${money(short - p.spend)} short.`);
    if (p.savingsNow > 0) tips.push(`Move ${money(Math.min(short, p.savingsNow))} back from your savings pot.`);
    tips.push('Nothing goes to savings this month.');
    return `<div class="card">${stepHead(6, 'Left over')}
      <div class="big-result r-bad"><div class="label">Short for ${next}</div><div class="amount">${money(short)}</div></div>
      <ul class="notes" style="color:var(--ink)">${tips.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
  }
  const open = p.debts.filter(d => d.base > 0);
  const m = state.months[p.period.id] || {};
  const pricey = open.filter(d => d.apr > 0).sort((a, b) => b.apr - a.apr)[0];
  const showExtra = view.open.extra || p.extra > 0;
  return `<div class="card">
    ${stepHead(6, 'Left over')}
    <div class="big-result r-good">
      <div class="label">Into your ${esc(s.savingsLabel)}</div>
      <div class="amount">${money(p.toSavings)}</div>
      ${p.extra ? `<div class="note">Plus ${money(p.extra)} off ${esc(debtName(p.extraDebt))}.</div>` : ''}
    </div>
    ${pricey ? `<p class="hint">${esc(pricey.name)} charges ${pricey.apr}% interest. Paying that off saves more than savings earn.</p>` : ''}
    ${open.length && p.leftover > 0 ? (showExtra ? `<div class="grid2" style="margin-top:12px">
      <div class="field"><label for="extraDebt">Pay some off</label>
        <select id="extraDebt" data-extra="debtId">${open.map(d => `<option value="${esc(d.id)}" ${d.id === (m.extra && m.extra.debtId) ? 'selected' : ''}>${esc(d.name)} (${money(d.base)})</option>`).join('')}</select></div>
      <div class="field"><label for="extraAmt">Amount</label>
        <div class="money-input"><span>&pound;</span><input id="extraAmt" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-extra="amount" value="${p.extra ? toPounds(p.extra) : ''}" placeholder="0.00"></div></div>
    </div>` : '<button class="link" data-action="show-extra">Put some towards a debt instead</button>') : ''}
  </div>`;
}

function standHtml(p) {
  const black = p.net >= 0;
  const rows = p.debts.filter(d => d.now > 0).map(d => lineHtml(d.name, d.now, d.nextMonth ? `${money(d.nextMonth)} going off in ${monthName(p.period.nextId)}` : '')).join('');
  return `<div class="card">
    ${stepHead(7, 'Where you stand')}
    ${lineHtml(state.settings.savingsLabel, p.savingsAfter, p.toSavings && !((state.months[p.period.id] || {}).ticks || {})['x:savings'] ? `Includes this month's ${money(p.toSavings)}` : '')}
    ${rows || '<p class="empty">No debts recorded.</p>'}
    ${lineHtml('Total debts', p.debtAfter, '', 'total')}
    <div class="big-result ${black ? 'r-good' : 'r-bad'}">
      <div class="label">${black ? 'In the black' : 'In the red'}</div>
      <div class="amount">${money(Math.abs(p.net))}</div>
      <div class="note">${black ? 'Your savings are more than everything you owe. This is money to play with.' : 'You owe more than you have saved. Every month you save brings this closer to zero.'}</div>
    </div>
    ${p.debtNextMonth ? `<p class="hint">Paying ${money(p.debtNextMonth)} off your debts in ${monthName(p.period.nextId)}.</p>` : ''}
  </div>`;
}

function checklistHtml(p) {
  const s = state.settings;
  const m = state.months[p.period.id] || {};
  const ticks = m.ticks || {};
  const steps = [];
  const send = p.monzo + p.toSavings;
  if (send > 0) {
    steps.push({ key: 'm:send', title: `Send ${money(send)} from Halifax to Monzo`, amount: send });
    if (p.shop) steps.push({ key: 'p:shop', title: 'Shop pot', amount: p.shop, indent: true });
    if (p.spend) steps.push({ key: 'p:spend', title: 'Spend pot', amount: p.spend, indent: true });
    if (p.toSavings) steps.push({ key: 'x:savings', title: s.savingsLabel, amount: p.toSavings, indent: true, sub: 'Ticking this adds it to your savings figure.' });
  }
  for (const t of p.transfers) steps.push({ key: t.key, title: t.name, amount: t.amount });
  if (p.extra) steps.push({ key: 'x:debt', title: `Extra off ${debtName(p.extraDebt)}`, amount: p.extra, debtId: p.extraDebt, sub: 'Ticking this takes it off the balance.' });
  if (p.reimbTotal && m.reimbLanded === false) steps.push({ key: 'r:later', title: `When work pays back ${money(p.reimbTotal)}, move it to your ${s.savingsLabel}`, amount: p.reimbTotal });
  steps.push({ key: 'h:check', title: `Check Halifax shows ${money(p.keep)}`, sub: `That covers every bill until ${fmtShort(p.period.nextEnd)}.` });
  const done = steps.filter(x => ticks[x.key]).length;
  return `<div class="card">
    <div class="card-head"><h2>Payday checklist</h2><span class="progress-text">${done} of ${steps.length} done</span></div>
    ${steps.map(x => `<label class="check-item ${ticks[x.key] ? 'done' : ''} ${x.indent ? 'indent' : ''}">
      <input type="checkbox" data-tick="${esc(x.key)}" data-amount="${x.amount || 0}" data-debt="${esc(x.debtId || '')}" ${ticks[x.key] ? 'checked' : ''}>
      <span class="check-text"><strong>${esc(x.title)}</strong>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</span>
      ${x.amount ? `<span class="check-amt">${money(x.amount)}</span>` : ''}
    </label>`).join('')}
  </div>`;
}

function hcResultHtml(tc, actual) {
  if (actual == null) return '';
  const diff = actual - tc.required;
  if (diff > 0) return `<div class="status ok"><strong>${money(diff)} more than needed.</strong> That's spare if you've already done your payday moves.</div>`;
  if (diff === 0) return '<div class="status ok"><strong>Spot on.</strong></div>';
  if (tc.dueToday && -diff <= tc.dueToday) return `<div class="status note"><strong>${money(-diff)} under.</strong> Fine if today's ${money(tc.dueToday)} has already gone out.</div>`;
  return `<div class="status bad"><strong>${money(-diff)} short.</strong> Top up Halifax before the next bill.</div>`;
}

function todayCheckHtml(p) {
  const tc = p.todayCheck;
  if (!tc || today() === p.period.payday) return ''; // on payday itself the checklist covers this
  const m = state.months[p.period.id] || {};
  const fresh = m.check && m.check.at === today();
  return `<div class="card">
    <h2>Halifax check for today</h2>
    <p>Halifax should have at least <strong>${money(tc.required)}</strong> in it today.</p>
    <p class="hint">${plural(tc.count, 'bill')} still to come up to ${fmtShort(p.period.nextEnd)}${p.buffer ? ', plus your buffer' : ''}.</p>
    <div class="field" style="margin-top:12px">
      <label for="hcActual">What does the Halifax app show?</label>
      <div class="money-input"><span>&pound;</span><input id="hcActual" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-hc value="${fresh ? toPounds(m.check.amount) : ''}" placeholder="0.00"></div>
    </div>
    <div id="hcResult">${hcResultHtml(tc, fresh ? m.check.amount : null)}</div>
  </div>`;
}

function timelineHtml(p) {
  const t = today();
  return `<details class="card" id="timeline" ${view.open.timeline ? 'open' : ''}>
    <summary>Halifax, bill by bill <span class="muted">${plural(p.timeline.length, 'bill')}</span></summary>
    <p class="hint" style="margin-top:0">What should be left in Halifax after each bill. Greyed rows have gone.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Bill</th><th class="amt">Amount</th><th class="amt">After</th></tr></thead>
      <tbody>
        <tr class="minor"><td class="nowrap">${fmtDate(p.period.payday)}</td><td>After payday moves</td><td></td><td class="amt">${money(p.keep)}</td></tr>
        ${p.timeline.map((l, i) => `<tr class="${l.date < t ? 'past' : ''} ${i === p.rest.length && i > 0 ? 'split' : ''}"><td class="nowrap">${fmtDate(l.date)}</td><td>${esc(l.name)}</td><td class="amt">${money(l.amount)}</td><td class="amt">${money(l.after)}</td></tr>`).join('')}
        <tr class="total"><td colspan="3">Left on ${fmtShort(p.period.nextEnd)}</td><td class="amt">${money(p.buffer)}</td></tr>
      </tbody>
    </table></div>
  </details>`;
}

function workingHtml(p, hasPay) {
  const s = state.settings;
  const per = p.period;
  const row = (label, amount, sign, cls) => `<tr class="${cls || ''}"><td>${label}</td><td class="amt">${sign || ''}${money(amount)}</td></tr>`;
  const notes = [];
  notes.push(`This pay keeps the rest of ${monthName(per.id)} covered and pays for all of ${monthName(per.nextId)}, so you stay a month ahead.`);
  const raw = Engine.clampDay(per.id, s.payDay);
  if (per.payday !== raw) notes.push(`Payday is ${fmtDate(per.payday)} because ${(state.months[per.id] || {}).paydayOverride ? 'you changed it' : `the ${ordinal(Engine.toDate(raw).getDate())} is a ${DOW_LONG[Engine.toDate(raw).getDay()]}`}.`);
  notes.push(`${monthName(per.nextId)} counts as ${plural(p.weeks, 'week')} for weekly budgets${p.weeks === p.autoWeeks ? ` (one for each ${DOW_LONG[s.weekDay == null ? 1 : s.weekDay]})` : ', as you set it'}.`);
  const paused = state.bills.filter(b => b.active === false).map(b => b.name);
  if (paused.length) notes.push(`Paused, so not counted: ${esc(listJoin(paused))}.`);
  if (!p.entered) notes.push(`No Halifax balance entered, so the plan assumes Halifax held exactly ${money(p.restTotal + p.buffer)} before your pay.`);
  notes.push('Every sum uses whole pence, so there are no rounding errors.');
  const check = hasPay && p.leftover >= 0
    ? (p.balanced
      ? `<p class="status ok">&#10003; ${money(p.halifax)} = ${money(p.keep)} Halifax + ${money(p.monzo)} Monzo + ${money(p.transfersTotal)} transfers + ${money(p.extra + p.toSavings)} left over</p>`
      : '<p class="status bad">These figures do not add up. Please report this.</p>')
    : '';
  return `<details class="card" id="working" ${view.open.working ? 'open' : ''}>
    <summary>Show the working</summary>
    <div class="table-wrap"><table><tbody>
      ${p.entered ? row('Halifax balance now', p.halifax) : row(`Pay ${money(p.pay)} plus ${money(p.restTotal + p.buffer)} kept back`, p.halifax)}
      ${row(`Rest of ${monthName(per.id)} (${p.rest.length})`, p.restTotal, '&minus; ')}
      ${row(`All of ${monthName(per.nextId)} (${p.next.length})`, p.nextTotal, '&minus; ')}
      ${p.buffer ? row('Buffer', p.buffer, '&minus; ') : ''}
      ${row('Free to share out', p.free, '', 'total')}
      ${hasPay ? row('Shop pot', p.shop, '&minus; ') + row('Spend pot', p.spend, '&minus; ') + row('Transfers', p.transfersTotal, '&minus; ') + row(p.leftover < 0 ? 'Short by' : 'Left over', Math.abs(p.leftover), '', 'total') : ''}
      ${hasPay && p.extra ? row('&nbsp;&nbsp;off ' + esc(debtName(p.extraDebt)), p.extra, '', 'minor') : ''}
      ${hasPay && p.leftover > 0 ? row('&nbsp;&nbsp;to ' + esc(s.savingsLabel), p.toSavings, '', 'minor') : ''}
    </tbody></table></div>
    ${check}
    <ul class="notes">${notes.map(n => `<li>${n}</li>`).join('')}</ul>
  </details>`;
}

function snapshot(p) {
  const m = month(p.period.id);
  const snap = { pay: p.pay, halifax: p.halifax, keep: p.keep, free: p.free, monzo: p.monzo, transfers: p.transfersTotal, leftover: p.leftover, toSavings: p.toSavings, extra: p.extra, net: p.net };
  if (JSON.stringify(m.snapshot) !== JSON.stringify(snap)) { m.snapshot = snap; save(); }
}

// ---------- Bills & budgets tab ----------
function renderMoney() {
  const el = $('#tab-money');
  const live = x => x.active !== false;
  const bills = [...state.bills].sort((a, b) => (a.once || '') .localeCompare(b.once || '') || a.day - b.day || a.name.localeCompare(b.name));
  const billTotal = state.bills.filter(b => live(b) && !b.once).reduce((t, b) => t + (b.amount || 0), 0);
  const budgetRow = b => entryRow('budget', b, `${b.per === 'week' ? 'A week' : 'A month'}${b.active === false ? ' &middot; Paused' : ''}`);
  el.innerHTML = `
    <div class="card">
      <div class="card-head"><h2>Halifax bills</h2><button class="btn btn-sm" data-action="add" data-kind="bill">Add bill</button></div>
      <p class="hint" style="margin-top:0">Everything that comes out of Halifax, with the day it goes.</p>
      ${bills.map(b => entryRow('bill', b, billMeta(b))).join('') || '<p class="empty">No bills yet. Add each direct debit and standing order.</p>'}
      ${lineHtml('Each month', billTotal, '', 'total')}
    </div>
    <div class="card">

function billMeta(b) {
  const bits = [b.once ? `${ordinal(b.day)} ${monthName(b.once)} only` : `The ${ordinal(b.day)}`];
  if (b.debtId) bits.push('Pays off ' + esc(debtName(b.debtId)));
  if (b.reimbursed) bits.push('Work pays back');
  if (b.active === false) bits.push('Paused');
  return bits.join(' &middot; ');
}

function entryRow(kind, x, meta) {
  return `<div class="row ${x.active === false ? 'paused' : ''}">

// ---------- Edit dialog (bills, pots, transfers) ----------
const dlg = $('#editDialog');
const form = $('#editForm');
let editing = null;
const LISTS = { bill: 'bills', budget: 'budgets', transfer: 'transfers' };
const TITLES = { bill: 'Halifax bill', budget: 'Monzo pot amount', transfer: 'payday transfer' };

function openEditor(kind, id) {
  const list = state[LISTS[kind]];
  const src = id ? list.find(x => x.id === id) : null;
  editing = { kind, id: src ? src.id : null };
  const f = form.elements;
  $('#editTitle').textContent = `${src ? 'Edit' : 'Add a'} ${TITLES[kind]}`;
  form.querySelectorAll('[data-for]').forEach(x => { x.hidden = x.dataset.for !== kind; });
  f.name.value = src ? src.name : '';
  f.amount.value = src ? toPounds(src.amount) : '';
  f.active.checked = !src || src.active !== false;
  if (kind === 'budget') {
    f.per.value = (src && src.per) || 'week';
    f.pot.value = (src && src.pot) || 'shop';
  }
  if (kind === 'bill') {
    f.day.value = src ? src.day : '';
    const start = view.monthId;
    const opts = ['<option value="">Every month</option>'];
    for (let i = 0; i < 13; i++) { const mid = Engine.shiftMonth(start, i); opts.push(`<option value="${mid}">Just once, in ${monthLabel(mid)}</option>`); }
    if (src && src.once && !opts.join('').includes(`"${src.once}"`)) opts.push(`<option value="${src.once}">Just once, in ${monthLabel(src.once)}</option>`);
    f.often.innerHTML = opts.join('');
    f.often.value = (src && src.once) || '';
    f.debtId.innerHTML = '<option value="">No</option>' + state.debts.map(d => `<option value="${esc(d.id)}">Yes: ${esc(d.name)}</option>`).join('');
    f.debtId.value = (src && src.debtId) || '';
    f.reimbursed.checked = !!(src && src.reimbursed);
  }
  $('#editDelete').hidden = !src;
  $('#editError').textContent = '';
  dlg.showModal();
  if (!src) setTimeout(() => f.name.focus(), 50);
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const f = form.elements;
  const err = msg => { $('#editError').textContent = msg; };
  const name = f.name.value.trim();
  const amount = toP(f.amount.value);
  if (!name) return err('Give it a name.');
  if (amount == null || amount < 0) return err('Enter an amount, like 49.99.');
  const obj = { id: editing.id || uid(), name, amount, active: f.active.checked };
  if (editing.kind === 'budget') { obj.per = f.per.value; obj.pot = f.pot.value; }
  if (editing.kind === 'bill') {
    const day = parseInt(f.day.value, 10);
    if (!(day >= 1 && day <= 31)) return err('Enter the day of the month it comes out (1 to 31).');
    obj.day = day;
    obj.once = f.often.value || null;
    obj.debtId = f.debtId.value || null;
    obj.reimbursed = f.reimbursed.checked;
  }
  const list = state[LISTS[editing.kind]];
  const i = list.findIndex(x => x.id === obj.id);
  if (i >= 0) list[i] = { ...list[i], ...obj }; else list.push(obj);
  save();
  dlg.close();
  renderTab();
  toast('Saved');
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

// ---------- Backup ----------
function exportBackup() {
  const data = JSON.stringify({ app: 'finance-manager', version: VERSION, exported: new Date().toISOString(), state }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `finance-manager-backup-${today()}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  state.meta.lastBackup = today();
  save();
  renderTab();
  toast('Backup downloaded');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast("That file isn't a backup from this planner."); return; }
    const s = obj && obj.state ? obj.state : obj;
    if (!s || !s.settings || !(Array.isArray(s.bills) || Array.isArray(s.items))) { toast("That file isn't a backup from this planner."); return; }
    if (!confirm('Replace everything with this backup?')) return;
    state = Array.isArray(s.bills) ? normalise(s) : fromV2(s);
    save();
    view.monthId = Engine.monthIdFor(today(), state);
    renderAll();
    toast('Backup restored');
  };
  reader.readAsText(file);
}

// ---------- Events ----------
const actions = {
  'prev-month': () => { view.monthId = Engine.shiftMonth(view.monthId, -1); renderPayday(); },
  'next-month': () => { view.monthId = Engine.shiftMonth(view.monthId, 1); if (view.tab !== 'payday') setTab('payday'); else renderPayday(); window.scrollTo(0, 0); },
  'this-month': () => { view.monthId = Engine.monthIdFor(today(), state); renderPayday(); },
  'goto': b => setTab(b.dataset.tab),
  'same-pay': () => { month().pay = state.months[Engine.shiftMonth(view.monthId, -1)].pay; save(); renderPayday(); },
  'reset-payday': () => { delete month().paydayOverride; save(); renderPayday(); },
  'reimb': b => { month().reimbLanded = b.dataset.v === '1'; save(); renderPayday(); },
  'weeks': b => {
    const m = month();
    const p = Engine.buildPlan(state, view.monthId, today());
    const n = Math.max(0, Math.min(6, p.weeks + Number(b.dataset.d)));
    if (n === p.autoWeeks) delete m.weeks; else m.weeks = n;
    save(); renderPlan();
  },
  'show-extra': () => { view.open.extra = true; renderPlan(); },
  'add': b => openEditor(b.dataset.kind, null),
  'edit': b => openEditor(b.dataset.kind, b.dataset.id),
  'close-dialog': () => dlg.close(),
  'delete-entry': () => {
    if (!editing || !editing.id || !confirm('Delete this?')) return;
    const k = LISTS[editing.kind];
    state[k] = state[k].filter(x => x.id !== editing.id);
    save(); dlg.close(); renderTab(); toast('Deleted');
  },
  'save-savings': () => {
    const v = toP($('#savBal').value);
    if (v == null || v < 0) { toast('Enter your savings balance.'); return; }
    state.savings = { balance: v, updated: today() };
    save(); renderDebts(); toast('Savings updated');
  },
  'add-debt': () => {
    const name = $('#ndName').value.trim();
    const bal = toP($('#ndBal').value);
    const apr = parseFloat($('#ndApr').value) || 0;
    if (!name || bal == null || bal < 0) { toast('Enter a name and what you owe.'); return; }
    state.debts.push({ id: uid(), name, balance: bal, startBalance: bal, apr: Math.max(0, apr), updated: today(), updatedTs: Date.now() });
    save(); renderDebts(); toast('Debt added');
  },
  'update-debt': b => {
    const d = state.debts.find(x => x.id === b.dataset.id);
    const v = toP($('#bal-' + CSS.escape(b.dataset.id)).value);
    if (!d || v == null || v < 0) { toast('Type the new balance first.'); return; }
    d.balance = v; d.updated = today(); d.updatedTs = Date.now();
    save(); renderDebts(); toast(`${d.name} updated`);
  },
  'edit-debt': b => { view.editDebt = view.editDebt === b.dataset.id ? null : b.dataset.id; renderDebts(); },
  'save-debt': b => {
    const d = state.debts.find(x => x.id === b.dataset.id);
    const name = $('#edName').value.trim();
    if (!d || !name) { toast('Give it a name.'); return; }
    d.name = name;
    d.apr = Math.max(0, parseFloat($('#edApr').value) || 0);
    view.editDebt = null;
    save(); renderDebts(); toast('Saved');
  },
  'delete-debt': b => {
    const d = state.debts.find(x => x.id === b.dataset.id);
    if (!d || !confirm(`Delete ${d.name}? Bills linked to it stay as normal bills.`)) return;
    state.debts = state.debts.filter(x => x.id !== d.id);
    for (const bill of state.bills) if (bill.debtId === d.id) bill.debtId = null;
    view.editDebt = null;
    save(); renderDebts();
  },
  'sync-connect': async () => {
    const token = $('#syncToken').value.trim();
    const owner = ($('#syncOwner') && $('#syncOwner').value.trim()) || guessOwner();
    const repo = ($('#syncRepo') && $('#syncRepo').value.trim()) || 'finance-data';
    const errEl = $('#syncError');
    if (!token) { errEl.textContent = 'Paste your key first.'; return; }
    if (!owner) { errEl.textContent = 'Open Store details and enter your GitHub account name.'; return; }
    errEl.textContent = 'Connecting...';
    try {
      await connect(owner, repo, token);
      renderAll();
      toast('Connected. Your figures now save to your private store.');
    } catch (e) {
      const el = $('#syncError');
      if (el) el.textContent = SYNC_HELP[e.kind] || SYNC_HELP.error;
    }
  },
  'sync-now': () => syncNow(),
  'sync-link': async () => {
    const link = connectLink();
    try { await navigator.clipboard.writeText(link); toast('Link copied. It contains your key, so only send it to yourself.'); }
    catch (e) { prompt('Copy this link. It contains your key, so only send it to yourself.', link); }
  },
  'sync-disconnect': () => {
    if (!confirm('Disconnect this device? Your figures stay in your private store.')) return;
    sync = {}; saveSync(); setSyncStatus('off'); renderAll();
  },
  'export': () => exportBackup(),
  'import': () => $('#importFile').click(),
  'reset-device': () => {
    if (!confirm('Remove the planner and your key from this device? Your private store is not touched.')) return;
    try { localStorage.removeItem(KEY); localStorage.removeItem(SYNC_KEY); } catch (e) { /* ignore */ }
    sync = {};
    state = defaults(); seed(state); saveLocal();
    view.monthId = Engine.monthIdFor(today(), state);
    setSyncStatus('off');
    setTab('payday');
    toast('Cleared from this device');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action], [role=tab]');
  if (!b) return;
  if (b.getAttribute('role') === 'tab') { setTab(b.dataset.tab); return; }
  const fn = actions[b.dataset.action];
  if (fn) { e.preventDefault(); fn(b, e); }
});

document.addEventListener('toggle', e => {
  if (e.target.matches && e.target.matches('details[id]')) view.open[e.target.id] = e.target.open;
}, true);

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.monthField) {
    const v = toP(el.value);
    const m = month();
    m[el.dataset.monthField] = el.dataset.monthField === 'pay' ? (v > 0 ? v : null) : v;
    if (m.pay && $('#samePay')) $('#samePay').hidden = true;
    save();
    renderPlan();
  } else if (el.hasAttribute('data-hc')) {
    const m = month();
    m.check = { amount: toP(el.value), at: today() };
    save();
    const p = Engine.buildPlan(state, view.monthId, today());
    if (p.todayCheck) $('#hcResult').innerHTML = hcResultHtml(p.todayCheck, m.check.amount);
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.tick) {
    const m = month();
    const key = el.dataset.tick;
    const amount = Number(el.dataset.amount) || 0;
    const addsToSavings = key === 'x:savings' || key === 'r:later';
    if (el.checked) {
      m.ticks[key] = { ts: Date.now(), at: today(), amount, debtId: el.dataset.debt || null };
      if (addsToSavings) state.savings = { balance: (state.savings.balance || 0) + amount, updated: today() };
    } else {
      const was = m.ticks[key];
      delete m.ticks[key];
      if (addsToSavings && was) state.savings = { balance: Math.max(0, (state.savings.balance || 0) - (was.amount || 0)), updated: today() };
    }
    save();
    renderPlan();
  } else if (el.dataset.extra) {
    const m = month();
    const cur = m.extra || { amount: 0, debtId: $('#extraDebt') ? $('#extraDebt').value : null };
    if (el.dataset.extra === 'amount') cur.amount = Math.max(0, toP(el.value) || 0);
    else cur.debtId = el.value;
    m.extra = cur;
    // The split changed, so the savings and extra-payment ticks need doing again
    delete m.ticks['x:debt'];
    if (m.ticks['x:savings']) {
      state.savings = { balance: Math.max(0, (state.savings.balance || 0) - (m.ticks['x:savings'].amount || 0)), updated: today() };
      delete m.ticks['x:savings'];
    }
    save();
    renderPlan();
  } else if (el.id === 'paydayOverride') {
    const id = view.monthId;
    const v = el.value;
    const usual = Engine.nominalPayday(id, state.settings);
    if (!v || Math.abs(Engine.diffDays(Engine.clampDay(id, state.settings.payDay), v)) > 10) {
      toast('Pick a date within 10 days of your usual payday.');
      el.value = Engine.period(id, state).payday;
      return;
    }
    const m = month();
    if (v === usual) delete m.paydayOverride; else m.paydayOverride = v;
    save();
    renderPayday();
  } else if (el.dataset.setting) {
    const k = el.dataset.setting;
    const type = el.dataset.type;
    let v;
    if (type === 'money') v = Math.max(0, toP(el.value) || 0);
    else if (type === 'int') v = parseInt(el.value, 10);
    else v = el.value.trim();
    if (k === 'payDay' && !(v >= 1 && v <= 31)) { toast('Enter a day from 1 to 31.'); el.value = state.settings.payDay; return; }
    if (k === 'savingsLabel' && !v) v = 'Savings pot';
    state.settings[k] = v;
    save();
    if (k === 'payDay' || k === 'weekendRule') view.monthId = Engine.monthIdFor(today(), state);
    toast('Saved');
  } else if (el.id === 'importFile' && el.files && el.files[0]) {
    importBackup(el.files[0]);
    el.value = '';
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.money-input input') && !e.target.closest('form')) e.target.blur();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && connected()) syncNow();
});
window.addEventListener('online', () => { if (connected()) syncNow(); });

// ---------- Start ----------
(async () => {
  if (incoming.broken) toast('That link is damaged. Ask for a new one.');
  const imported = !!incoming.import && confirm('Load the figures in this link? They replace what is on this device.');
  if (imported) {
    state = normalise(incoming.import);
    view.monthId = Engine.monthIdFor(today(), state);
    state.meta.updatedAt = Date.now();
    saveLocal();
    toast('Figures loaded');
  }
  saveLocal();
  setTab('payday');
  if (incoming.connect && incoming.connect.t) {
    try {
      await connect(incoming.connect.o || guessOwner(), incoming.connect.r || 'finance-data', incoming.connect.t);
      if (imported) { sync.dirty = true; saveSync(); await syncNow(); }
      renderAll();
      toast('This device is connected to your private store.');
    } catch (e) { setTab('settings'); }
  } else if (connected()) {
    if (imported) { sync.dirty = true; saveSync(); }
    syncNow();
  } else {
    setSyncStatus('off');
  }
})();
</script>
</body>
</html>
